name: Update Contribution Activity Chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-chart.yml"

permissions:
  contents: write

concurrency:
  group: activity-chart
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          default-days: "30"
          ranges: "30,90,365"
          theme: github-compact
          layout: spacious
          output-dir: activity-dist

      - name: Publish generated charts
        env:
          TARGET_BRANCH: activity-assets
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir/"
          # Enforce the profile-wide grayscale palette on generated SVG charts.
          find "$temp_dir" -type f -name "*.svg" -exec sed -i \
            -e "s/#39d353/#A0A0A0/Ig" \
            -e "s/#238636/#777777/Ig" \
            -e "s/#2ea043/#969696/Ig" \
            -e "s/#3fb950/#BDBDBD/Ig" \
            -e "s/#f0f6fc/#E5E5E5/Ig" \
            -e "s/#8b949e/#A0A0A0/Ig" {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$TARGET_BRANCH"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          git commit -m "chore: refresh contribution activity charts"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$TARGET_BRANCH"
