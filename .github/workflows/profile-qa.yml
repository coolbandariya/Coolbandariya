name: Profile README QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate README and SVG assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          checks = {
              "ECM identity": "electronics & computer engineering" in readme.lower(),
              "exact banner URL": "d2ol7oe51mr4n9.cloudfront.net/user_3JuNbn6G1fWehaUubucloQMU8cb/e0930052-b661-4682-a281-67b390d8146e.png" in readme,
              "featured projects": all(name in readme for name in ("GitGlobe", "NIRDHOOM", "Saathi", "SATARK", "Adapt AI")),
              "animated build log": "assets/profile-motion.svg" in readme,
              "animated footer": "assets/profile-footer.svg" in readme,
              "contribution snake": "github-contribution-grid-snake.svg" in readme,
              "no obsolete Minecraft theme": not any(word in readme.lower() for word in ("minecraft", "nether")),
          }
          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")
          assert all(checks.values()), "README content validation failed"

          refs = re.findall(r'(?:src|href)="(\./assets/[^"]+)"', readme)
          for ref in refs:
              path = Path(ref.split("?", 1)[0])
              assert path.is_file(), f"Missing local asset: {path}"

          for path in (Path("assets/profile-motion.svg"), Path("assets/profile-footer.svg")):
              ET.parse(path)
              source = path.read_text(encoding="utf-8")
              assert 'role="img"' in source, f"Missing accessible role: {path}"
              assert "prefers-reduced-motion" in source, f"Missing reduced-motion support: {path}"
              assert "<script" not in source.lower(), f"Unexpected script element: {path}"
              style = re.search(r"<style>(.*?)</style>", source, flags=re.S)
              if style:
                  assert style.group(1).count("{") == style.group(1).count("}"), f"Unbalanced CSS: {path}"

          assert "href=\"#selected-work\"" in readme
          assert "href=\"#toolkit\"" in readme
          assert "href=\"#engineering-approach\"" in readme
          print(f"PASS: {len(refs)} local asset references, both SVGs parse, and navigation targets are present.")
          PY
