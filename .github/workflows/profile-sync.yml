name: Sync profile data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Refresh recruiter-facing profile data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from textwrap import dedent

          owner = "kaustubhdua"
          repo = "kaustubhdua"

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "kaustubhdua-profile-sync",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          profile = api(f"/users/{owner}")
          repos = []
          page = 1
          while page <= 3:
              batch = api(f"/users/{owner}/repos?per_page=100&page={page}&type=owner&sort=updated")
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          public_repos = profile.get("public_repos", 0)
          followers = profile.get("followers", 0)
          following = profile.get("following", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos)
          forks = sum(r.get("forks_count", 0) for r in repos)

          excluded = {owner}
          def repo_row(r):
              name = r["name"]
              desc = (r.get("description") or "No description yet.").replace("|", "\\|")
              topics = ", ".join(r.get("topics") or [])[:90] or "—"
              updated = (r.get("updated_at") or "")[:10] or "—"
              return f'| [{name}](https://github.com/{owner}/{name}) | {desc} | {r.get("stargazers_count", 0)} | {r.get("language") or "—"} | {topics} | {updated} |'

          featured_names = ["nihdhoom", "Saathi", "JYC-Website", "smart_waste_project"]
          featured_rows = []
          for name in featured_names:
              try:
                  meta = api(f"/repos/{owner}/{name}")
                  if meta.get("fork") or meta.get("archived"):
                      raise RuntimeError(f"Featured repository must be an owned, active source repository: {name}")
                  langs = api(f"/repos/{owner}/{name}/languages")
                  languages = ", ".join(list(langs.keys())[:5]) or meta.get("language") or "—"
                  topics = ", ".join((meta.get("topics") or [])[:5])
                  tech = languages + (f" · {topics}" if topics else "")
                  featured_rows.append(
                      f'| [{name}](https://github.com/{owner}/{name}) | {meta.get("stargazers_count", 0)} | {meta.get("forks_count", 0)} | {tech} | {(meta.get("updated_at") or "")[:10]} |'
                  )
              except Exception:
                  pass

          latest = []
          for r in repos:
              if r.get("fork") or r.get("archived") or r["name"] in excluded:
                  continue
              latest.append(r)
              if len(latest) == 6:
                  break

          refreshed = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          block = dedent(f"""<!-- PROFILE_SYNC_START -->
          ## Live engineering snapshot

          <table>
          <tr>
          <td width="25%" align="center"><strong>{public_repos}</strong><br/><sub>PUBLIC REPOSITORIES</sub></td>
          <td width="25%" align="center"><strong>{stars}</strong><br/><sub>REPOSITORY STARS</sub></td>
          <td width="25%" align="center"><strong>{followers}</strong><br/><sub>FOLLOWERS</sub></td>
          <td width="25%" align="center"><strong>{forks}</strong><br/><sub>FORKS</sub></td>
          </tr>
          </table>

          **Featured projects — live repository signals**

          | Project | Stars | Forks | Detected technology | Updated |
          |---|---:|---:|---|---|
          {chr(10).join(featured_rows)}

          **Latest repository activity**

          | Repository | What it is | Stars | Primary language | Topics | Updated |
          |---|---|---:|---|---|---|
          {chr(10).join(repo_row(r) for r in latest)}

          <sub>Automatically refreshed {refreshed}. Featured projects above remain curated; this section reflects the current public GitHub portfolio.</sub>
          <!-- PROFILE_SYNC_END -->""").strip()

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- PROFILE_SYNC_START -->"
          end = "<!-- PROFILE_SYNC_END -->"
          if start in readme and end in readme:
              before = readme.split(start, 1)[0]
              after = readme.split(end, 1)[1]
              readme = before + block.strip() + after
          else:
              marker = "\n## GitHub evidence\n"
              if marker in readme:
                  readme = readme.replace(marker, "\n" + block.strip() + "\n" + marker, 1)
              else:
                  readme += "\n\n" + block.strip() + "\n"

          readme_path.write_text(readme, encoding="utf-8")

      - name: Commit refreshed profile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No profile data changes."
            exit 0
          fi
          git commit -m "chore: refresh profile data"
          git push
