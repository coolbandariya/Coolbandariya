name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: kaustubhdua
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23222222&color_dots=%23ebebeb,%23c7c7c7,%23999999,%23666666,%23333333
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f0eee8&color_dots=%230d1117,%23262626,%23474747,%23797979,%23d8d5ce
      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
