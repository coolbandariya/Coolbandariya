<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54" role="img" aria-labelledby="title desc">
<title id="title">Electronics and Computer Engineering · JIIT Noida</title>
<desc id="desc">A very slow, elegant cross-fade between the academic program and university, with a long hold and gentle transitions.</desc>
<defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600;letter-spacing:1.7px;fill:#f4efe5;text-anchor:middle}
    .frame{opacity:0;animation:softfade 32s ease-in-out infinite;will-change:opacity}
    .second{animation-delay:16s}
    @keyframes softfade{
      0%,8%{opacity:0}
      22%{opacity:1}
      78%{opacity:1}
      92%,100%{opacity:0}
    }
    @media(prefers-reduced-motion:reduce){
      .frame{animation:none!important;opacity:0;will-change:auto}
      .first{opacity:1}
    }
  </style>
</defs>
<path d="M86 42H814" stroke="#b9b1a5" stroke-opacity=".28" stroke-width="1"/>
<circle cx="66" cy="42" r="2.5" fill="#f4efe5" opacity=".65"/>
<circle cx="834" cy="42" r="2.5" fill="#f4efe5" opacity=".65"/>
<text class="mono frame first" x="450" y="29">ELECTRONICS &amp; COMPUTER ENGINEERING</text>
<text class="mono frame second" x="450" y="29">JIIT NOIDA</text>
</svg>