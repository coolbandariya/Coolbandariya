<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">Animated engineering capability wall</title><desc id="d">Five kinetic capability cards with moving progress signals, pulse indicators and a gradient scan line.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.c{animation:u 14s cubic-bezier(.39,.24,.3,1) infinite}.c2{animation:u 14s 1s cubic-bezier(.39,.24,.3,1) infinite}.c3{animation:u 14s 2s cubic-bezier(.39,.24,.3,1) infinite}.c4{animation:u 14s 3s cubic-bezier(.39,.24,.3,1) infinite}.dash{stroke-dasharray:14 18;animation:d 14s linear infinite}.beam{animation:b 42s cubic-bezier(.39,.24,.3,1) infinite}@keyframes u{50%{transform:translateY(-6px)}}}@keyframes d{to{stroke-dashoffset:-128}}@keyframes b{0%,100%{transform:translateX(-180px);opacity:0}25%,75%{opacity:.6}50%{transform:translateX(1220px)}@media(prefers-reduced-motion:reduce){.c,.c2,.c3,.c4,.dash,.beam{animation:none}}</style></defs><rect width="1200" height="270" rx="24" fill="url(#bg)" stroke="#263244"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><text x="40" y="34" font-size="10" fill="#64748b" letter-spacing="2.6">CAPABILITY WALL / SYSTEMS I CAN ACTUALLY BUILD</text><g class="c"><rect x="40" y="58" width="210" height="140" rx="17" fill="#0f172a" stroke="#263244"/><text x="62" y="88" font-size="10" fill="#22c55e">01 / AI + ML</text><text x="62" y="116" font-size="13" fill="#e2e8f0">models</text><text x="62" y="137" font-size="11" fill="#64748b">embeddings · evaluation</text></g><g class="c2"><rect x="270" y="58" width="210" height="140" rx="17" fill="#0f172a" stroke="#263244"/><text x="292" y="88" font-size="10" fill="#38bdf8">02 / DATA</text><text x="292" y="116" font-size="13" fill="#e2e8f0">pipelines</text><text x="292" y="137" font-size="11" fill="#64748b">APIs · PostgreSQL</text></g><g class="c3"><rect x="500" y="58" width="210" height="140" rx="17" fill="#0f172a" stroke="#263244"/><text x="522" y="88" font-size="10" fill="#a78bfa">03 / PRODUCT</text><text x="522" y="116" font-size="13" fill="#e2e8f0">interfaces</text><text x="522" y="137" font-size="11" fill="#64748b">React · TypeScript · UX</text></g><g class="c4"><rect x="730" y="58" width="210" height="140" rx="17" fill="#0f172a" stroke="#263244"/><text x="752" y="88" font-size="10" fill="#22c55e">04 / OPTIMISE</text><text x="752" y="116" font-size="13" fill="#e2e8f0">constraints</text><text x="752" y="137" font-size="11" fill="#64748b">routing · prioritisation</text></g><g class="c"><rect x="960" y="58" width="200" height="140" rx="17" fill="#0f172a" stroke="#263244"/><text x="982" y="88" font-size="10" fill="#38bdf8">05 / SHIP</text><text x="982" y="116" font-size="13" fill="#e2e8f0">production</text><text x="982" y="137" font-size="11" fill="#64748b">CI · testing · security</text></g><path class="dash" d="M40 220H1160" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/><path class="beam" d="M40 220H180" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/></g></svg>