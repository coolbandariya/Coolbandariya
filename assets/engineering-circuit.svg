<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="t d"><title id="t">Engineering capability wall</title><desc id="d">Animated technical tiles for AI, data, product, optimisation and infrastructure capabilities.</desc><defs><linearGradient id="a"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.x{stroke-dasharray:12 20;animation:d 3s linear infinite}.t{animation:u 4s ease-in-out infinite}.t2{animation:u 4s 1s ease-in-out infinite}@keyframes d{to{stroke-dashoffset:-128}}@keyframes u{50%{transform:translateY(-4px)}}@media(prefers-reduced-motion:reduce){.x,.t,.t2{animation:none}}</style></defs><rect width="1200" height="220" rx="22" fill="#070b16" stroke="#1e293b"/><path d="M54 182H1146" stroke="#1e293b" stroke-width="2"/><path class="x" d="M54 182H1146" stroke="url(#a)" stroke-width="3"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><g class="t"><rect x="54" y="38" width="200" height="112" rx="16" fill="#0f172a" stroke="#263244"/><text x="76" y="68" font-size="10" fill="#22c55e">01 / AI + ML</text><text x="76" y="98" font-size="12" fill="#cbd5e1">PyTorch · TensorFlow</text><text x="76" y="122" font-size="12" fill="#94a3b8">embeddings · evaluation</text></g><g class="t2"><rect x="276" y="38" width="200" height="112" rx="16" fill="#0f172a" stroke="#263244"/><text x="298" y="68" font-size="10" fill="#38bdf8">02 / DATA</text><text x="298" y="98" font-size="12" fill="#cbd5e1">Python · PostgreSQL</text><text x="298" y="122" font-size="12" fill="#94a3b8">APIs · pipelines · Redis</text></g><g class="t"><rect x="498" y="38" width="200" height="112" rx="16" fill="#0f172a" stroke="#263244"/><text x="520" y="68" font-size="10" fill="#a78bfa">03 / PRODUCT</text><text x="520" y="98" font-size="12" fill="#cbd5e1">React · Next.js · Vite</text><text x="520" y="122" font-size="12" fill="#94a3b8">TypeScript · UX · QA</text></g><g class="t2"><rect x="7