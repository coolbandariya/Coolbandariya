<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
<title id="t">Electronics and software signal animation</title><desc id="d">Animated circuit traces connect hardware, software, AI, and data.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<rect width="1200" height="150" rx="18" fill="#0b1220"/>
<g fill="none" stroke="#263449" stroke-width="2"><path d="M0 75H180L220 35H420L460 75H740L780 35H980L1020 75H1200"/><path d="M0 105H130L170 65H330L370 105H610L650 65H850L890 105H1200"/><path d="M0 45H90L120 75H260M940 105H1080L1110 75H1200"/></g>
<g fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 18"><path d="M0 75H180L220 35H420L460 75H740L780 35H980L1020 75H1200"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="5s" repeatCount="indefinite"/></path><path d="M0 105H130L170 65H330L370 105H610L650 65H850L890 105H1200"><animate attributeName="stroke-dashoffset" from="0" to="120" dur="7s" repeatCount="indefinite"/></path></g>
<g fill="#0b1220" stroke="url(#g)" stroke-width="2"><circle cx="220" cy="35" r="7"><animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="460" cy="75" r="7"><animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="780" cy="35" r="7"><animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1020" cy="75" r="7"><animate attributeName="r" values="6;10;6" dur="2.6s" repeatCount="indefinite"/></circle></g>
<g fill="#e2e8f0" font-family="monospace" font-size="13" text-anchor="middle"><text x="300" y="25">ELECTRONICS</text><text x="600" y="91">COMPUTER SCIENCE</text><text x="900" y="25">APPLIED AI</text></g>
</svg>