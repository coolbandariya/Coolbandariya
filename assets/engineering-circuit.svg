<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-labelledby="t d"><title id="t">Engineering capability map</title><desc id="d">Animated signal traces connecting AI, data, product, geospatial and optimisation capabilities.</desc><defs><linearGradient id="g"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0284c7"/></linearGradient><style>.f{stroke-dasharray:9 15;animation:d 3s linear infinite}.n{animation:p 2s ease-in-out infinite}.n2{animation:p 2s ease-in-out .8s infinite}@keyframes d{to{stroke-dashoffset:-96}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.f,.n,.n2{animation:none}}</style></defs><rect width="1200" height="170" rx="22" fill="#07111f"/><g fill="none" stroke="#334155" stroke-width="2"><path d="M70 85H1130"/><path d="M250 85V35M470 85V135M730 85V35M950 85V135"/></g><g class="f" fill="none" stroke="url(#g)" stroke-width="3"><path d="M70 85H1130"/></g><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" fill="#cbd5e1" font-size="13"><text x="250" y="29">AI / ML</text><text x="470" y="158">DATA / SYSTEMS</text><text x="730" y="29">PRODUCT / WEB</text><text x="950" y="158">GEO / OPTIMISATION</text></g><g fill="#22c55e"><circle class="n" cx="250" cy="85" r="5"/><circle class="n2" cx="470" cy="85" r="5"/><circle class="n" cx="730" cy="85" r="5"/><circle class="n2" cx="950" cy="85" r="5"/></g></svg>