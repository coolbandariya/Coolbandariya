<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">Fretboard of engineering habits</title><desc id="desc">Six guitar strings and moving fret markers represent design, implementation, data, testing, documentation and deployment.</desc><style>.mono{font-family:Arial,Helvetica,sans-serif}.string{stroke:#A0A0A0;stroke-width:1.5}.string:nth-child(2){stroke-width:1.3}.string:nth-child(3){stroke-width:1.1}.fret{stroke:#555;stroke-width:2}.marker{fill:#E6EDF3;animation:travel 8s ease-in-out infinite}.m2{animation-delay:-1.3s}.m3{animation-delay:-2.6s}.m4{animation-delay:-3.9s}.m5{animation-delay:-5.2s}.m6{animation-delay:-6.5s}@keyframes travel{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(700px);opacity:1}}@media(prefers-reduced-motion:reduce){.marker{animation:none!important}}</style><rect width="1000" height="250" rx="12" fill="#0D1117" stroke="#30363D"/><text class="mono" x="28" y="30" fill="#A0A0A0" font-size="12" letter-spacing="3">SIX STRINGS / SIX ENGINEERING HABITS</text><g class="fret"><path d="M250 56V206M350 56V206M450 56V206M550 56V206M650 56V206M750 56V206M850 56V206"/></g><g class="string"><path d="M28 70H970M28 94H970M28 118H970M28 142H970M28 166H970M28 190H970"/></g><g><circle class="marker m1" cx="180" cy="70" r="5"/><circle class="marker m2" cx="180" cy="94" r="5"/><circle class="marker m3" cx="180" cy="118" r="5"/><circle class="marker m4" cx="180" cy="142" r="5"/><circle class="marker m5" cx="180" cy="166" r="5"/><circle class="marker m6" cx="180" cy="190" r="5"/></g><g class="mono" fill="#C9C9C9" font-size="14"><text x="30" y="74">DESIGN</text><text x="30" y="98">BUILD</text><text x="30" y="122">DATA</text><text x="30" y="146">TEST</text><text x="30" y="170">DOCS</text><text x="30" y="194">SHIP</text></g><text class="mono" x="970" y="230" text-anchor="end" fill="#666" font-size="10" letter-spacing="2">TUNE EVERY STRING BEFORE THE FINAL TAKE</text></svg>