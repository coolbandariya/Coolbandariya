<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512" role="img" aria-labelledby="title desc">
<title id="title">Now Playing — monochrome electric guitar studio</title>
<desc id="desc">Cinematic black-and-white music studio with a detailed Stratocaster-style double-cutaway electric guitar, six strings, fretboard, frets, pickups, bridge, control knobs and tuning machines, set before an amplifier. Animated sound waves and an Iris by Goo Goo Dolls player panel sit above practice, technique, daily goal and genre cards.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset=".52" stop-color="#171717"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#666"/><stop offset=".2" stop-color="#161616"/><stop offset=".5" stop-color="#333"/><stop offset=".72" stop-color="#070707"/><stop offset="1" stop-color="#3a3a3a"/></linearGradient>
 <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee"/><stop offset=".18" stop-color="#555"/><stop offset=".52" stop-color="#151515"/><stop offset=".82" stop-color="#666"/><stop offset="1" stop-color="#ddd"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#777"/><stop offset=".58" stop-color="#222"/><stop offset=".8" stop-color="#ddd"/><stop offset="1" stop-color="#555"/></linearGradient>
 <linearGradient id="amp" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292929"/><stop offset="1" stop-color="#080808"/></linearGradient>
 <radialGradient id="spot"><stop stop-color="#ddd" stop-opacity=".19"/><stop offset=".42" stop-color="#999" stop-opacity=".07"/><stop offset="1" stop-color="#ddd" stop-opacity="0"/></radialGradient>
 <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".48" stop-color="#aaa" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".28"/></linearGradient>
 <linearGradient id="steelString" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#777"/><stop offset="1" stop-color="#eee"/></linearGradient>
 <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
 <pattern id="grill" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="#777" stroke-opacity=".24" stroke-width=".7"/></pattern>
 <filter id="shadow"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<style>
 .mono{fill:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.muted{fill:#aaa;font-family:ui-monospace,monospace;letter-spacing:1px}.panel{fill:#080808;fill-opacity:.8;stroke:#777;stroke-opacity:.6}.wave{fill:none;stroke:#eee;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:2 5;animation:dash 7s linear infinite}.eq{fill:#ddd;transform-box:fill-box;transform-origin:center;animation:eq .8s ease-in-out infinite alternate}.eq:nth-child(2n){animation-delay:-.3s}.eq:nth-child(3n){animation-delay:-.55s}.eq:nth-child(4n){animation-delay:-.15s}.string{fill:none;stroke:#f4f4f4;stroke-width:.8;animation:pluck 2.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.string:nth-child(2n){animation-delay:-.6s}.string:nth-child(3n){animation-delay:-1.1s}.pulse{animation:pulse 3s ease-in-out infinite}.progress{animation:progress 12s linear infinite}.guitar-rim{fill:none;stroke:url(#edgeLight);stroke-width:3;opacity:.8}.glint{fill:none;stroke:#fff;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:24 460;animation:glint 6s ease-in-out infinite}.studio-grain{fill:url(#grill);opacity:.12;pointer-events:none}
 @keyframes glint{0%,100%{stroke-dashoffset:480;opacity:0}25%,70%{opacity:.8}55%{stroke-dashoffset:0;opacity:.25}}@keyframes dash{to{stroke-dashoffset:-100}}@keyframes eq{from{transform:scaleY(.18);opacity:.4}to{transform:scaleY(1);opacity:1}}@keyframes pluck{0%,100%{transform:skewY(0);opacity:.7}18%{transform:skewY(1deg);opacity:1}38%{transform:skewY(-.8deg);opacity:.9}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes progress{from{transform:translateX(0)}to{transform:translateX(164px)}}
 @media(prefers-reduced-motion:reduce){.wave,.eq,.string,.pulse,.progress{animation:none}}
</style>
