<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512" role="img" aria-labelledby="title desc">
<title id="title">Now Playing — monochrome electric guitar studio</title>
<desc id="desc">Cinematic black-and-white music studio with a detailed Stratocaster-style double-cutaway electric guitar, six strings, fretboard, frets, pickups, bridge, control knobs and tuning machines, set before an amplifier. Animated sound waves and an Iris by Goo Goo Dolls player panel sit above practice, technique, daily goal and genre cards.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset=".52" stop-color="#171717"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#666"/><stop offset=".2" stop-color="#161616"/><stop offset=".5" stop-color="#333"/><stop offset=".72" stop-color="#070707"/><stop offset="1" stop-color="#3a3a3a"/></linearGradient>
 <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee"/><stop offset=".18" stop-color="#555"/><stop offset=".52" stop-color="#151515"/><stop offset=".82" stop-color="#666"/><stop offset="1" stop-color="#ddd"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#777"/><stop offset=".58" stop-color="#222"/><stop offset=".8" stop-color="#ddd"/><stop offset="1" stop-color="#555"/></linearGradient>
 <linearGradient id="amp" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#292929"/><stop offset="1" stop-color="#080808"/></linearGradient>
