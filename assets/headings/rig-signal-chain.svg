<svg xmlns="http://www.w3.org/2000/svg" width="720" height="58" viewBox="0 0 720 58" role="img" aria-labelledby="title desc"><title id="title">Rig &amp; Signal Chain</title><desc id="desc">Muted gray section heading in a monochrome theme. Animated underline and traveling signal accent, with reduced-motion support.</desc><text class="heading-text" x="50%" y="39" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI, sans-serif" font-size="31" font-weight="650" letter-spacing="0.2">Rig &amp; Signal Chain</text><path d="M0 55 H720" stroke="#343434" stroke-width="1.5"/>
<defs><filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="0" result="blur"><animate attributeName="stdDeviation" values="0;1.2;0" dur="4s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.heading-text{fill:#A0A0A0;animation:textPulse 4.9799999999999995s ease-in-out infinite alternate;filter:url(#textGlow)}
@keyframes titleGlow{from{fill:#888888;letter-spacing:.2px}to{fill:#E5E5E5;letter-spacing:1.1px}}to{fill:#E5E5E5;letter-spacing:1.1px}}
.wave{fill:none;stroke:#777777;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:2 8;animation:wave 8s linear infinite}
.glint{stroke:#E5E5E5;stroke-width:2;stroke-linecap:round;stroke-dasharray:24 696;animation:glint 6s linear infinite}
@keyframes textPulse{from{opacity:.72;fill:#8A8A8A}to{opacity:1;fill:#F0F0F0}}\n@keyframes wave{to{stroke-dashoffset:-120}}
@keyframes glint{from{stroke-dashoffset:720}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.heading-text,.wave,.glint{animation:none!important;filter:none!important}.heading-text{fill:#A0A0A0;letter-spacing:.2px}}
</style>
<path class="wave" d="M0 55 H720"/>
<path class="glint" d="M0 55 H720"/>
</svg>