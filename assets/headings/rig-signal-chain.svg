<svg xmlns="http://www.w3.org/2000/svg" width="720" height="82" viewBox="0 0 720 82" role="img" aria-labelledby="title desc">
<title id="title">THE SIGNAL CHAIN</title>
<desc id="desc">Editorial heading with a left-to-right animated text highlight, a fine monochrome divider and a section-specific music-inspired accent.</desc>
<defs><clipPath id="heading-reveal"><rect x="0" y="0" width="0" height="82" class="reveal-window"/></clipPath></defs>
<text class="eyebrow" x="360" y="16" text-anchor="middle">02 / TOOLS &amp; TECHNOLOGY</text>
<text class="heading-base" x="360" y="49" text-anchor="middle">THE SIGNAL CHAIN</text>
<text class="heading-highlight" x="360" y="49" text-anchor="middle" clip-path="url(#heading-reveal)">THE SIGNAL CHAIN</text>
<path class="rule" d="M0 66 H720"/>
<path class="track" d="M0 66 H150 L164 66 L176 54 L188 66 H278 L290 60 L302 66 H420 L432 47 L444 66 H570 L582 59 L594 66 H720"/>
<style>
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;font-weight:600;letter-spacing:2.6px;fill:#858585}
.heading-base,.heading-highlight{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:30px;font-weight:750;letter-spacing:1.2px}
.heading-base{fill:#BDBDBD}
.heading-highlight{fill:#FFFFFF}
.reveal-window{animation:revealText 8.8s cubic-bezier(.22,.7,.18,1) infinite}
.rule{stroke:#303030;stroke-width:1}
.track{fill:none;stroke:#858585;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:trackDraw 7s ease-in-out infinite}
.record{fill:none;stroke:#858585;stroke-width:1.2;transform-origin:360px 66px;animation:spin 12s linear infinite}
@keyframes revealText{0%,8%{width:0}35%,78%{width:720px}100%{width:0}}
@keyframes trackDraw{0%,10%{stroke-dashoffset:520;opacity:.35}45%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-520;opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.reveal-window,.track,.record{animation:none!important;transform:none!important}.reveal-window{width:720px}.heading-base{fill:#E5E5E5}.heading-highlight{display:none}.track{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
</svg>