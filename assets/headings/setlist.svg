<svg xmlns="http://www.w3.org/2000/svg" width="720" height="82" viewBox="0 0 720 82" role="img" aria-labelledby="title desc">
<title id="title">THE SETLIST</title>
<desc id="desc">Editorial section heading with a one-pass text reveal and a restrained waveform accent.</desc>
<text class="eyebrow" x="360" y="16" text-anchor="middle">01 / SELECTED WORK</text>
<text class="heading-text" x="360" y="49" text-anchor="middle">THE SETLIST</text>
<path class="rule" d="M0 66 H720"/>
<path class="track" d="M0 66 H245 l6 -4 6 8 6 -12 6 16 6 -10 6 6 H720"/>
<style>
.eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;font-weight:600;letter-spacing:2.6px;fill:#858585}
.heading-text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:30px;font-weight:750;letter-spacing:1.2px;fill:#E5E5E5;stroke:#F5F5F5;stroke-width:.35;stroke-dasharray:1000;stroke-dashoffset:0;animation:titleDraw 8.4s cubic-bezier(.2,.7,.2,1) infinite}
.rule{stroke:#303030;stroke-width:1}
.track{fill:none;stroke:#858585;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:trackDraw 7s ease-in-out infinite}
.record{fill:none;stroke:#858585;stroke-width:1.2;transform-origin:360px 66px;animation:spin 12s linear infinite}
@keyframes titleDraw{0%,6%{opacity:.35;stroke-dashoffset:1000;fill:#777777}25%{opacity:1;stroke-dashoffset:0;fill:#FFFFFF}38%{stroke-dashoffset:0;fill:#E5E5E5}55%,100%{opacity:1;stroke-dashoffset:0;fill:#E5E5E5}}
@keyframes trackDraw{0%,10%{stroke-dashoffset:520;opacity:.35}45%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-520;opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.heading-text,.track,.record{animation:none!important;stroke-dashoffset:0!important;transform:none!important}.heading-text{fill:#E5E5E5;stroke:none}.track{stroke-dasharray:none}}
</style>
</svg>