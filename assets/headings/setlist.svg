<svg xmlns="http://www.w3.org/2000/svg" width="720" height="58" viewBox="0 0 720 58" role="img" aria-labelledby="title desc"><title id="title">Setlist</title><desc id="desc">Setlist section heading with a subtle animated soundwave underline and a traveling signal highlight.</desc><text class="heading-text" x="50%" y="39" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI, sans-serif" font-size="31" font-weight="650" letter-spacing="0.2">Setlist</text><path d="M0 55 H720" stroke="#343434" stroke-width="1.5"/>
<style>
.heading-text{fill:#A0A0A0;animation:textPulse 4.6s ease-in-out infinite alternate;}
to{fill:#E5E5E5;letter-spacing:1.1px}}
.wave{fill:none;stroke:#A0A0A0;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:2 8;animation:wave 8s linear infinite}
.glint{stroke:#E5E5E5;stroke-width:2;stroke-linecap:round;stroke-dasharray:22 698;animation:glint 7s linear infinite}
@keyframes textPulse{from{opacity:.72;fill:#8A8A8A}to{opacity:1;fill:#F0F0F0}}
@keyframes wave{to{stroke-dashoffset:-100}}
@keyframes glint{from{stroke-dashoffset:720}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.heading-text,.wave,.glint{animation:none!important;filter:none!important}.heading-text{fill:#A0A0A0;letter-spacing:.2px}}
</style>
<path class="wave" d="M0 55 H720"/>
<path class="glint" d="M0 55 H720"/>
</svg>