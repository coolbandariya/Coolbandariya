<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-labelledby="title desc">
  <title id="title">Snake Eating My Contribution Snake</title>
  <desc id="desc">Centered muted-gray heading with a restrained monochrome divider for the contribution snake animation. Animated underline and traveling signal accent, with reduced-motion support.</desc>
  <text class="heading-text" x="450" y="39" text-anchor="middle" fill="#A0A0A0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="650" letter-spacing="0.6">Snake Eating My Contribution Snake</text>
  <path d="M300 59 H600" stroke="#343434" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="290" cy="59" r="2" fill="#777777"/>
  <circle cx="610" cy="59" r="2" fill="#777777"/>

<style>
.heading-text{animation:titleGlow 6.8s ease-in-out infinite alternate}@keyframes titleGlow{from{fill:#888888;letter-spacing:.6px}to{fill:#E5E5E5;letter-spacing:1.4px}}
.wave{fill:none;stroke:#777777;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:2 8;animation:wave 12s linear infinite}
.glint{stroke:#E5E5E5;stroke-width:2;stroke-linecap:round;stroke-dasharray:24 696;animation:glint 10s linear infinite}
@keyframes wave{to{stroke-dashoffset:-120}}
@keyframes glint{from{stroke-dashoffset:720}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.heading-text,.wave,.glint{animation:none!important}.heading-text{fill:#A0A0A0;letter-spacing:.6px}}
</style>
<path class="wave" d="M0 55 H720"/>
<path class="glint" d="M0 55 H720"/>
</svg>