<svg xmlns="http://www.w3.org/2000/svg" width="960" height="112" viewBox="0 0 960 112" role="img" aria-labelledby="title desc"><title id="title">Studio Notes</title><desc id="desc">Studio notes heading with a monochrome signal sweep and six guitar-string lines.</desc><defs><linearGradient id="beam"><stop stop-color="#E6EDF3" stop-opacity="0"/><stop offset=".5" stop-color="#E6EDF3" stop-opacity=".8"/><stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/></linearGradient><clipPath id="heading-reveal"><rect class="reveal-clip" x="0" y="0" width="960" height="112"/></clipPath></defs><style>.mono{font-family:Arial,Helvetica,sans-serif}.heading-highlight{fill:#E6EDF3}.reveal-clip{animation:revealText 2s cubic-bezier(.2,.7,.2,1) both}.signal{stroke-dasharray:4 9;animation:signal 8s linear infinite}.beam{animation:beam 7s ease-in-out infinite}@keyframes revealText{from{width:0}to{width:960px}}@keyframes signal{to{stroke-dashoffset:-156}}@keyframes beam{0%,100%{transform:translateX(-260px);opacity:.15}50%{transform:translateX(260px);opacity:.8}}@media(prefers-reduced-motion:reduce){.reveal-clip,.signal,.beam{animation:none!important}.reveal-clip{width:960px}.beam{display:none}}</style><rect width="960" height="112" rx="8" fill="#0D1117"/><g stroke="#30363D" stroke-width="1"><path d="M24 78H936M24 84H936M24 90H936M24 96H936M24 102H936M24 108H936"/></g><path class="signal" d="M24 77H936" stroke="#A0A0A0" fill="none"/><g clip-path="url(#heading-reveal)"><text class="mono heading-highlight" x="28" y="54" font-size="38" font-weight="700" letter-spacing="4">STUDIO NOTES</text></g><g class="beam"><path d="M20 18H270" stroke="url(#beam)" stroke-width="4"/></g><text class="mono" x="932" y="32" text-anchor="end" font-size="12" fill="#8B949E" letter-spacing="3">SESSION LOG / 04</text></svg>