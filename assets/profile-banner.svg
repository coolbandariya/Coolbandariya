<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — ECM, AI and Software Engineering</title>
<desc id="desc">An animated midnight-blue engineering profile banner with luminous cyan and violet orbital paths, a bold name, and a concise engineering focus.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".5" stop-color="#071426"/><stop offset="1" stop-color="#080716"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".38" stop-color="#38bdf8" stop-opacity=".7"/><stop offset=".7" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
  <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".64" stop-color="#dbeafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#0ea5e9" stop-opacity=".24"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width=".7"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    .rise2{animation:rise 1.2s .12s cubic-bezier(.2,.8,.2,1) both}
    .flow{animation:flow 13s ease-in-out infinite;transform-origin:850px 180px}
    .orbit{animation:spin 32s linear infinite;transform-origin:940px 180px}
    .orbit2{animation:spin 22s linear infinite reverse;transform-origin:940px 180px}
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes flow{0%,100%{transform:translate(-12px,4px) rotate(-2deg)}50%{transform:translate(10px,-8px) rotate(2deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.rise,.rise2,.flow,.orbit,.orbit2,.pulse{animation:none}}
  </style>
</defs>
<rect width="1200" height="380" rx="28" fill="url(#bg)"/>
<rect width="1200" height="380" rx="28" fill="url(#grid)"/>
<ellipse cx="940" cy="180" rx="270" ry="220" fill="url(#glow)" filter="url(#blur)"/>
<path d="M520 380 790 0h150L670 380Z" fill="url(#aurora)" opacity=".18"/>
<path d="M0 330C240 270 350 405 620 290S1010 70 1200 120" fill="none" stroke="url(#aurora)" stroke-width="1.4" opacity=".65"/>
<path d="M0 350C250 290 370 420 640 305S1030 85 1200 135" fill="none" stroke="#38bdf8" stroke-opacity=".12"/>
<rect x="20" y="20" width="1160" height="340" rx="20" fill="none" stroke="#64748b" stroke-opacity=".25"/>
<path d="M40 20H220M20 40V100M980 360H1160M1180 280V340" stroke="#67e8f9" stroke-opacity=".6" stroke-width="1.4"/>
<g class="flow">
  <ellipse cx="940" cy="180" rx="190" ry="66" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.2" transform="rotate(-28 940 180)"/>
  <ellipse cx="940" cy="180" rx="145" ry="92" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.2" transform="rotate(32 940 180)"/>
  <ellipse cx="940" cy="180" rx="112" ry="142" fill="none" stroke="#67e8f9" stroke-opacity=".2" stroke-width="1" transform="rotate(66 940 180)"/>
  <circle cx="940" cy="180" r="72" fill="none" stroke="#94a3b8" stroke-opacity=".16" stroke-dasharray="2 8"/>
  <circle cx="940" cy="180" r="48" fill="#0ea5e9" fill-opacity=".06" stroke="#67e8f9" stroke-opacity=".4"/>
  <circle cx="940" cy="180" r="8" fill="#67e8f9" class="pulse"/>
  <circle cx="791" cy="124" r="4" fill="#a78bfa"/><circle cx="1061" cy="88" r="3" fill="#67e8f9"/><circle cx="1038" cy="276" r="4" fill="#a78bfa"/><circle cx="854" cy="303" r="3" fill="#67e8f9"/>
</g>
<g class="orbit"><circle cx="1128" cy="180" r="4" fill="#67e8f9"/><circle cx="752" cy="180" r="3" fill="#a78bfa"/></g>
<g class="orbit2"><circle cx="940" cy="38" r="3.5" fill="#c4b5fd"/><circle cx="940" cy="322" r="3" fill="#67e8f9"/></g>
<g class="rise">
  <text x="66" y="67" class="mono" font-size="10" letter-spacing="3.2" fill="#67e8f9">JIIT NOIDA <tspan fill="#475569">/</tspan> ELECTRONICS &amp; COMPUTER ENGINEERING</text>
  <text x="62" y="176" class="sans" font-size="83" font-weight="850" letter-spacing="-4.8" fill="url(#type)">KAUSTUBH</text>
  <text x="66" y="246" class="sans" font-size="65" font-weight="750" letter-spacing="-2.2" fill="#f8fafc">DUA<tspan fill="#67e8f9">.</tspan></text>
</g>
<g class="rise2">
  <rect x="68" y="274" width="34" height="3" rx="1.5" fill="#67e8f9"/>
  <text x="114" y="281" class="sans" font-size="14" font-weight="550" fill="#cbd5e1">AI systems · Data · Product engineering</text>
  <text x="68" y="318" class="mono" font-size="10" letter-spacing="2.4" fill="#64748b">BUILD THOUGHTFULLY. VERIFY EVERYTHING.</text>
</g>
<text x="1138" y="48" text-anchor="end" class="mono" font-size="9" letter-spacing="2" fill="#64748b">PROFILE / 01</text>
</svg>