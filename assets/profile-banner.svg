<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Electronics &amp; Computer Engineering</title>
<desc id="desc">Premium engineering portfolio header introducing Kaustubh Dua, an Electronics &amp; Computer Engineering student building AI, data, systems and product software.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".52" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="name"><stop stop-color="#f8fafc"/><stop offset=".58" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".20"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <style>
    .in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}.in2{animation:in 1.4s .18s cubic-bezier(.2,.8,.2,1) both}
    .in3{animation:in 1.5s .32s cubic-bezier(.2,.8,.2,1) both}.float{animation:float 9s ease-in-out infinite}
    .pulse{animation:pulse 7s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.in,.in2,.in3,.float,.pulse{animation:none}}
  </style>
</defs>

<rect width="1600" height="650" rx="32" fill="url(#bg)"/>
<rect x="20" y="20" width="1560" height="610" rx="26" fill="url(#grid)"/>
<circle cx="1260" cy="170" r="360" fill="url(#glow)" filter="url(#blur)"/>
<rect x="24" y="24" width="1552" height="602" rx="26" fill="none" stroke="#475569" stroke-opacity=".45"/>

<g class="in" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <text x="76" y="78" font-size="11" fill="#64748b" letter-spacing="3">KAUSTUBH DUA / ENGINEERING PROFILE</text>
  <text x="76" y="108" font-size="11" fill="#22c55e" letter-spacing="2">ELECTRONICS &amp; COMPUTER ENGINEERING · JIIT NOIDA</text>
</g>

<g class="in2" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
  <text x="76" y="210" font-size="82" font-weight="850" letter-spacing="-5" fill="url(#name)">KAUSTUBH</text>
  <text x="76" y="290" font-size="82" font-weight="850" letter-spacing="-5" fill="#f8fafc">DUA</text>
  <rect x="78" y="320" width="480" height="4" rx="2" fill="url(#accent)"/>
  <text x="78" y="358" font-size="21" font-weight="600" fill="#cbd5e1">AI · DATA · SYSTEMS · PRODUCT ENGINEERING</text>
  <text x="78" y="390" font-size="14" fill="#94a3b8">Building useful software around real constraints, evidence and measurable outcomes.</text>
</g>

<g class="in3 float" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <rect x="790" y="78" width="710" height="220" rx="24" fill="#0b1220" fill-opacity=".90" stroke="#334155"/>
  <text x="822" y="112" font-size="10" fill="#64748b" letter-spacing="2.4">ENGINEERING SIGNAL</text>
  <text x="822" y="152" font-size="17" fill="#22c55e">01</text><text x="862" y="152" font-size="17" fill="#e2e8f0">Understand the problem</text>
  <text x="822" y="187" font-size="17" fill="#38bdf8">02</text><text x="862" y="187" font-size="17" fill="#e2e8f0">Design the system</text>
  <text x="822" y="222" font-size="17" fill="#a78bfa">03</text><text x="862" y="222" font-size="17" fill="#e2e8f0">Build · test · verify</text>
  <text x="822" y="257" font-size="17" fill="#22c55e">04</text><text x="862" y="257" font-size="17" fill="#e2e8f0">Ship useful software</text>
</g>

<g class="in3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <rect x="790" y="326" width="710" height="220" rx="24" fill="#0b1220" fill-opacity=".88" stroke="#334155"/>
  <text x="822" y="360" font-size="10" fill="#64748b" letter-spacing="2.4">CURRENT TOOLKIT</text>
  <g fill="#111827" stroke="#334155">
    <rect x="822" y="382" width="190" height="58" rx="12"/><rect x="1028" y="382" width="190" height="58" rx="12"/><rect x="1234" y="382" width="232" height="58" rx="12"/>
    <rect x="822" y="454" width="190" height="58" rx="12"/><rect x="1028" y="454" width="190" height="58" rx="12"/><rect x="1234" y="454" width="232" height="58" rx="12"/>
  </g>
  <text x="846" y="418" font-size="13" fill="#22c55e">React · Next.js</text>
  <text x="1052" y="418" font-size="13" fill="#38bdf8">Python · FastAPI</text>
  <text x="1258" y="418" font-size="13" fill="#a78bfa">PostgreSQL · Supabase</text>
  <text x="846" y="490" font-size="13" fill="#cbd5e1">Three.js · Leaflet</text>
  <text x="1052" y="490" font-size="13" fill="#cbd5e1">OR-Tools · APIs</text>
  <text x="1258" y="490" font-size="13" fill="#cbd5e1">Docker · GitHub Actions</text>
</g>

<g class="pulse" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <circle cx="76" cy="568" r="4" fill="#22c55e"/>
  <text x="90" y="572" font-size="11" fill="#64748b" letter-spacing="1.8">OPEN SOURCE · PRODUCT THINKING · ENGINEERING DISCIPLINE</text>
</g>
</svg>