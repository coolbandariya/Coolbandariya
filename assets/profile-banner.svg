<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Electronics and Computer Engineering</title>
<desc id="desc">A premium engineering profile banner focused on AI, data, systems and product engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset=".52" stop-color="#07111f"/>
    <stop offset="1" stop-color="#050816"/>
  </linearGradient>
  <radialGradient id="glowA" cx="50%" cy="34%" r="58%">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".14"/>
    <stop offset=".48" stop-color="#6366f1" stop-opacity=".06"/>
    <stop offset="1" stop-color="#020617" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="84%" cy="82%" r="40%">
    <stop offset="0" stop-color="#22c55e" stop-opacity=".08"/>
    <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#38bdf8"/>
    <stop offset=".5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .enter{animation:enter 1.2s ease-out both}
    .enter2{animation:enter2 1.5s ease-out both}
    .float{animation:float 9s ease-in-out infinite}
    .pulse{animation:pulse 7s ease-in-out infinite}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes enter2{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-8px)}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:.68}}
    @media(prefers-reduced-motion:reduce){.enter,.enter2,.float,.pulse{animation:none}}
  </style>
</defs>

<!-- deep, quiet canvas -->
<rect width="1200" height="520" rx="30" fill="url(#bg)"/>
<rect width="1200" height="520" rx="30" fill="url(#glowA)"/>
<rect width="1200" height="520" rx="30" fill="url(#glowB)"/>

<!-- restrained atmospheric depth -->
<circle class="float" cx="1040" cy="105" r="105" fill="#38bdf8" opacity=".055" filter="url(#blur)"/>
<circle class="pulse" cx="170" cy="420" r="95" fill="#a78bfa" opacity=".045" filter="url(#blur)"/>

<!-- very subtle technical texture -->
<g opacity=".045" stroke="#cbd5e1" stroke-width="1">
  <path d="M80 92h1040M80 132h1040M80 172h1040M80 212h1040M80 252h1040M80 292h1040M80 332h1040M80 372h1040M80 412h1040"/>
  <path d="M120 62v396M200 62v396M280 62v396M360 62v396M440 62v396M520 62v396M600 62v396M680 62v396M760 62v396M840 62v396M920 62v396M1000 62v396M1080 62v396"/>
</g>

<!-- main glass panel -->
<rect class="enter2" x="55" y="48" width="1090" height="424" rx="26" fill="#07111f" fill-opacity=".72" stroke="#334155" stroke-opacity=".62"/>
<rect x="56" y="49" width="1088" height="422" rx="25" fill="none" stroke="url(#accent)" stroke-opacity=".13"/>

<!-- top identity -->
<g class="enter">
  <text x="600" y="103" text-anchor="middle" class="mono" font-size="12" letter-spacing="3.2" fill="#64748b">KAUSTUBH DUA  /  ENGINEERING PROFILE</text>
  <text x="600" y="132" text-anchor="middle" class="mono" font-size="11" letter-spacing="2.1" fill="#38bdf8">ELECTRONICS &amp; COMPUTER ENGINEERING · JIIT NOIDA</text>
</g>

<!-- name -->
<g class="enter2">
  <text x="600" y="229" text-anchor="middle" class="sans" font-size="82" font-weight="850" letter-spacing="-3.2" fill="#f8fafc">KAUSTUBH DUA</text>
  <text x="600" y="273" text-anchor="middle" class="sans" font-size="21" font-weight="650" letter-spacing="4.6" fill="#cbd5e1">AI · DATA · SYSTEMS · PRODUCT ENGINEERING</text>
</g>

<!-- concise positioning -->
<g class="enter">
  <text x="600" y="316" text-anchor="middle" class="sans" font-size="15" fill="#94a3b8">Building useful software where intelligent systems meet real-world constraints.</text>
</g>

<!-- capability chips -->
<g class="enter2">
  <rect x="246" y="350" width="188" height="42" rx="21" fill="#0f1b2d" stroke="#334155"/>
  <circle cx="269" cy="371" r="4" fill="#38bdf8"/>
  <text x="285" y="376" class="mono" font-size="12" letter-spacing="1.1" fill="#dbeafe">AI SYSTEMS</text>

  <rect x="452" y="350" width="188" height="42" rx="21" fill="#0f1b2d" stroke="#334155"/>
  <circle cx="475" cy="371" r="4" fill="#a78bfa"/>
  <text x="491" y="376" class="mono" font-size="12" letter-spacing="1.1" fill="#ddd6fe">DATA PRODUCTS</text>

  <rect x="658" y="350" width="296" height="42" rx="21" fill="#0f1b2d" stroke="#334155"/>
  <circle cx="681" cy="371" r="4" fill="#22c55e"/>
  <text x="697" y="376" class="mono" font-size="12" letter-spacing="1.1" fill="#dcfce7">OPTIMISATION · AUTOMATION</text>
</g>

<!-- bottom signal -->
<g class="enter">
  <text x="600" y="430" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="2.4" fill="#64748b">BUILD WITH CONSTRAINTS · VERIFY THE SYSTEM · SHIP SOMETHING USEFUL</text>
</g>

<rect x="55" y="48" width="1090" height="424" rx="26" fill="none" stroke="#0f172a" stroke-opacity=".8"/>
</svg>