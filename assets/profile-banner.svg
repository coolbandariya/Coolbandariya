<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Electronics and Computer Engineering</title>
<desc id="desc">A high-contrast, dither-inspired profile banner. Large readable name and engineering focus sit beside a textured monochrome digital field with subtle animated signal accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111016"/><stop offset=".6" stop-color="#191720"/><stop offset="1" stop-color="#0e0d13"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bef264"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.35" fill="#f4f1ea" opacity=".78"/>
    <circle cx="7" cy="7" r=".7" fill="#f4f1ea" opacity=".35"/>
  </pattern>
  <pattern id="fine" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f4f1ea" stroke-opacity=".08"/></pattern>
  <radialGradient id="field"><stop stop-color="#f4f1ea" stop-opacity=".92"/><stop offset=".42" stop-color="#a1a1aa" stop-opacity=".5"/><stop offset="1" stop-color="#27232e" stop-opacity="0"/></radialGradient>
  <clipPath id="visual"><path d="M770 56H1138V352H770Z"/></clipPath>
  <mask id="ditherMask">
    <rect x="750" y="36" width="410" height="336" fill="url(#field)"/>
  </mask>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .intro{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
    .intro2{animation:rise .9s .16s cubic-bezier(.2,.8,.2,1) both}
    .texture{animation:drift 18s linear infinite}
    .scan{animation:scan 7s ease-in-out infinite}
    .signal{animation:pulse 3s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-24px)}}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:.12}50%{transform:translateY(250px);opacity:.55}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.intro,.intro2,.texture,.scan,.signal{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<rect width="1200" height="430" rx="24" fill="url(#fine)"/>
<rect x="22" y="22" width="1156" height="386" rx="17" fill="none" stroke="#f4f1ea" stroke-opacity=".17"/>
<path d="M22 22H174M1020 408H1178" stroke="#bef264" stroke-width="2"/>
<g class="intro">
  <text x="62" y="69" class="mono" font-size="11" letter-spacing="2.1" fill="#bef264">JIIT NOIDA <tspan fill="#6b6875">/</tspan> ECM</text>
  <text x="58" y="174" class="sans" font-size="82" font-weight="850" letter-spacing="-4.6" fill="#f4f1ea">KAUSTUBH</text>
  <text x="62" y="248" class="sans" font-size="78" font-weight="800" letter-spacing="-3.4" fill="#f4f1ea">DUA<tspan fill="#bef264">.</tspan></text>
</g>
<g class="intro2">
  <rect x="64" y="278" width="35" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="310" class="sans" font-size="17" font-weight="600" fill="#e7e5e4">AI systems · Data · Product engineering</text>
  <text x="64" y="340" class="sans" font-size="14" fill="#a8a5b1">Building useful software for real-world problems.</text>
  <text x="64" y="378" class="mono" font-size="10" letter-spacing="1.7" fill="#85818e">BUILD / TEST / VERIFY / SHIP</text>
</g>
<g clip-path="url(#visual)">
  <rect x="770" y="56" width="368" height="296" rx="8" fill="#211f28" stroke="#f4f1ea" stroke-opacity=".18"/>
  <g class="texture">
    <rect x="770" y="56" width="410" height="296" fill="url(#dots)" mask="url(#ditherMask)"/>
    <rect x="770" y="56" width="410" height="296" fill="url(#field)" opacity=".65"/>
    <path d="M782 292C830 210 854 240 901 162S1000 94 1126 119" fill="none" stroke="#f4f1ea" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M782 318C844 238 866 265 922 188S1035 120 1136 143" fill="none" stroke="#bef264" stroke-opacity=".8" stroke-width="1.2"/>
  </g>
  <path class="scan" d="M770 94H1138" stroke="#bef264" stroke-width="1.5" stroke-opacity=".8"/>
  <path d="M794 76V96M794 76H814M1116 332V312M1116 332H1096" stroke="#f4f1ea" stroke-opacity=".7" fill="none"/>
  <text x="794" y="330" class="mono" font-size="9" letter-spacing="1.5" fill="#f4f1ea">SIGNAL / PATTERN / SYSTEM</text>
</g>
<g class="signal">
  <circle cx="1114" cy="78" r="3" fill="#bef264"/>
  <circle cx="793" cy="329" r="2.5" fill="#67e8f9"/>
</g>
<text x="1138" y="383" text-anchor="end" class="mono" font-size="9" letter-spacing="1.4" fill="#85818e">ENGINEERING PORTFOLIO / 01</text>
</svg>