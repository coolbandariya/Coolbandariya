<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title>Kaustubh Dua — Electronics and Computer Engineering</title>
  <desc>Engineering profile focused on AI systems, data products, optimisation and software engineering.</desc>
<title id="title">Kaustubh Dua — Electronics &amp; Computer Engineering</title>
<desc id="desc">Editorial engineering profile header for Kaustubh Dua, an Electronics &amp; Computer Engineering student focused on AI, data, systems and product engineering.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="name"><stop stop-color="#ffffff"/><stop offset=".62" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".04"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
<style>
.i{animation:enter 1.1s cubic-bezier(.2,.8,.2,1) both}.i2{animation:enter 1.3s .14s cubic-bezier(.2,.8,.2,1) both}.ambient{animation:ambient 10s ease-in-out infinite}.meta{animation:meta 8s ease-in-out infinite}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes ambient{0%,100%{opacity:.55;transform:translate(0,0)}50%{opacity:.85;transform:translate(-10px,6px)}}@keyframes meta{0%,100%{opacity:.65}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.i,.i2,.ambient,.meta{animation:none}}
</style>
</defs>
<rect width="1600" height="600" rx="30" fill="url(#bg)"/>
<rect x="20" y="20" width="1560" height="560" rx="26" fill="url(#grid)"/>
<circle class="ambient" cx="1290" cy="150" r="340" fill="url(#glow)" filter="url(#blur)"/>
<rect x="24" y="24" width="1552" height="552" rx="26" fill="none" stroke="#475569" stroke-opacity=".42"/>

<g class="i" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<text x="76" y="78" font-size="11" fill="#64748b" letter-spacing="3.2">KAUSTUBH DUA / ENGINEERING PROFILE</text>
<text x="76" y="108" font-size="11" fill="#22c55e" letter-spacing="2">ELECTRONICS &amp; COMPUTER ENGINEERING · JIIT NOIDA</text>
</g>

<g class="i2" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
<text x="76" y="225" font-size="92" font-weight="850" letter-spacing="-6" fill="url(#name)">KAUSTUBH</text>
<text x="76" y="312" font-size="92" font-weight="850" letter-spacing="-6" fill="#f8fafc">DUA</text>
<rect x="80" y="340" width="520" height="4" rx="2" fill="url(#accent)"/>
<text x="80" y="382" font-size="22" font-weight="650" fill="#dbeafe">AI · DATA · SYSTEMS · PRODUCT ENGINEERING</text>
<text x="80" y="414" font-size="15" fill="#94a3b8">Building useful software where data, systems and real-world constraints meet.</text>
</g>

<g class="i2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<text x="1040" y="440" font-size="11" fill="#64748b" letter-spacing="2.4">ENGINEERING INTERESTS</text>
<text x="1040" y="478" font-size="17" fill="#e2e8f0">AI systems</text>
<text x="1040" y="508" font-size="17" fill="#e2e8f0">data products</text>
<text x="1040" y="538" font-size="17" fill="#e2e8f0">optimisation + automation</text><text x="1040" y="566" font-size="12" fill="#64748b">ECM · JIIT NOIDA · BUILDER</text>
</g>

<g class="meta" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<circle cx="80" cy="512" r="4" fill="#22c55e"/>
<text x="94" y="516" font-size="11" fill="#64748b" letter-spacing="1.7">OPEN SOURCE · PRODUCT THINKING · ENGINEERING DISCIPLINE</text>
</g>
</svg>