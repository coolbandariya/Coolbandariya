<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Electronics and Computer Engineering, AI and Software</title>
<desc id="desc">Responsive animated portfolio banner. Clear name and engineering focus on the left, restrained cyan and violet systems visualization on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".55" stop-color="#09172a"/><stop offset="1" stop-color="#100d22"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffffff"/><stop offset=".7" stop-color="#dbeafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#0ea5e9" stop-opacity=".2"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".065"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .intro{animation:enter .8s cubic-bezier(.2,.8,.2,1) both}
    .intro2{animation:enter 1s .12s cubic-bezier(.2,.8,.2,1) both}
    .orbit{transform-origin:925px 205px;animation:spin 28s linear infinite}
    .orbit2{transform-origin:925px 205px;animation:spin 38s linear infinite reverse}
    .float{animation:float 8s ease-in-out infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.intro,.intro2,.orbit,.orbit2,.float,.pulse{animation:none}}
  </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<ellipse cx="930" cy="205" rx="330" ry="270" fill="url(#light)" filter="url(#blur)"/>
<path d="M620 420 860 0h110L730 420Z" fill="#0ea5e9" opacity=".055"/>
<rect x="18" y="18" width="1164" height="384" rx="20" fill="none" stroke="#64748b" stroke-opacity=".28"/>
<path d="M38 18H180M18 38V96M1020 402H1162M1182 290V382" stroke="#67e8f9" stroke-opacity=".6" stroke-width="1.4"/>
<g class="intro">
  <text x="64" y="68" class="mono" font-size="11" letter-spacing="2.8" fill="#67e8f9">JIIT NOIDA <tspan fill="#475569">/</tspan> ECM</text>
  <text x="62" y="164" class="sans" font-size="74" font-weight="850" letter-spacing="-3.8" fill="url(#name)">KAUSTUBH</text>
  <text x="64" y="235" class="sans" font-size="72" font-weight="800" letter-spacing="-2.5" fill="#f8fafc">DUA<tspan fill="#67e8f9">.</tspan></text>
  <rect x="66" y="264" width="36" height="3" rx="1.5" fill="#67e8f9"/>
  <text x="66" y="298" class="sans" font-size="18" font-weight="600" fill="#dbeafe">AI systems · Data · Product engineering</text>
  <text x="66" y="329" class="sans" font-size="14" fill="#94a3b8">Building practical software for real-world problems.</text>
  <text x="66" y="368" class="mono" font-size="10" letter-spacing="2.1" fill="#64748b">BUILD THOUGHTFULLY  /  VERIFY EVERYTHING</text>
</g>
<g class="float">
  <circle cx="925" cy="205" r="150" fill="#0b1220" fill-opacity=".42" stroke="#64748b" stroke-opacity=".22"/>
  <circle cx="925" cy="205" r="114" fill="none" stroke="#64748b" stroke-opacity=".2" stroke-dasharray="2 7"/>
  <ellipse cx="925" cy="205" rx="194" ry="65" fill="none" stroke="url(#line)" stroke-opacity=".8" stroke-width="1.5" transform="rotate(-28 925 205)"/>
  <ellipse cx="925" cy="205" rx="174" ry="83" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.3" transform="rotate(30 925 205)"/>
  <ellipse cx="925" cy="205" rx="128" ry="104" fill="none" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.4" transform="rotate(64 925 205)"/>
  <circle cx="925" cy="205" r="43" fill="#0ea5e9" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/>
  <circle cx="925" cy="205" r="7" fill="#22d3ee" class="pulse"/>
</g>
<g class="orbit">
  <circle cx="1119" cy="205" r="4" fill="#67e8f9"/><circle cx="731" cy="205" r="3.5" fill="#a78bfa"/>
</g>
<g class="orbit2">
  <circle cx="925" cy="91" r="4" fill="#a78bfa"/><circle cx="925" cy="319" r="3.5" fill="#67e8f9"/>
</g>
<g class="pulse" fill="#67e8f9"><circle cx="805" cy="116" r="3"/><circle cx="1057" cy="294" r="3"/></g>
<text x="1138" y="51" text-anchor="end" class="mono" font-size="9" letter-spacing="2" fill="#64748b">PORTFOLIO / 01</text>
</svg>