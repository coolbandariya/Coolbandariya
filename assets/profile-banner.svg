<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="614" viewBox="0 0 1536 614" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Engineering a smarter tomorrow</title>
<desc id="desc">A wide editorial profile banner inspired by monochrome halftone print design. Oversized ivory typography sits left, with an abstract dithered sculptural portrait on the right, thin technical rules and restrained lime accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100e12"/><stop offset=".56" stop-color="#141116"/><stop offset="1" stop-color="#0d0c10"/></linearGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fffaf0"/><stop offset=".65" stop-color="#eee8dc"/><stop offset="1" stop-color="#bcb5a9"/></linearGradient>
  <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9f99d"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
  <radialGradient id="portraitGlow"><stop stop-color="#f4efe5" stop-opacity=".2"/><stop offset="1" stop-color="#f4efe5" stop-opacity="0"/></radialGradient>
  <pattern id="grain" width="71" height="71" patternUnits="userSpaceOnUse"><circle cx="5" cy="12" r=".8" fill="#fff" opacity=".13"/><circle cx="41" cy="29" r=".6" fill="#fff" opacity=".16"/><circle cx="63" cy="57" r=".7" fill="#fff" opacity=".12"/><path d="M18 0v71M0 47h71" stroke="#fff" stroke-opacity=".025"/></pattern>
  <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.2" cy="3.2" r="1.7" fill="#f4efe5"/></pattern>
  <pattern id="fineDots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.15" fill="#f4efe5"/></pattern>
  <clipPath id="bust">
    <path d="M1037 72C1102 58 1160 93 1178 158C1190 202 1178 236 1204 262L1226 285L1200 299C1204 329 1189 355 1168 365L1163 407C1190 422 1215 444 1223 478L1245 548L1162 566L1090 550L1024 565L951 548L968 492C979 462 1003 435 1034 420L1032 387C1002 376 983 352 976 321C950 306 943 283 955 258C966 239 981 232 993 238C991 198 998 114 1037 72Z"/>
  </clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  <style>
    .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .intro{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
    .intro2{animation:rise 1s .15s cubic-bezier(.2,.8,.2,1) both}
    .scan{animation:scan 9s ease-in-out infinite}
    .flow{animation:flow 14s linear infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:.08}50%{transform:translateY(320px);opacity:.48}}
    @keyframes flow{to{stroke-dashoffset:-180}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.intro,.intro2,.scan,.flow,.pulse{animation:none!important}}
  </style>
</defs>
