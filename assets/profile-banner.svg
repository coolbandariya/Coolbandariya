<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Electronics and Computer Engineering</title>
<desc id="desc">Minimal luxury editorial portfolio banner with oversized ivory typography, cobalt accent, kinetic underline and a moving engineering ticker. No orbital illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0d"/><stop offset=".58" stop-color="#111318"/><stop offset="1" stop-color="#08090c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a3e635"/><stop offset="1" stop-color="#d9f99d"/></linearGradient>
  <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r=".7" fill="#fff" opacity=".12"/><circle cx="90" cy="43" r=".55" fill="#fff" opacity=".08"/><circle cx="42" cy="108" r=".6" fill="#fff" opacity=".07"/></pattern>
  <clipPath id="reveal"><rect x="52" y="95" width="1096" height="185" rx="2"><animate attributeName="width" from="0" to="1096" dur="1.05s" fill="freeze"/></rect></clipPath>
  <clipPath id="ticker"><rect x="0" y="340" width="1200" height="80"/></clipPath>
  <style>
    .sans{font-family:Inter,Arial,Helvetica,sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .eyebrow{animation:fade .7s ease-out both}
    .sub{animation:fade .8s .55s ease-out both}
    .line{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.2s .45s cubic-bezier(.2,.7,.2,1) forwards}
    .word{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
    .ticker{animation:marquee 26s linear infinite}
    .dot{animation:blink 2.4s ease-in-out infinite}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes marquee{to{transform:translateX(-50%)}}
    @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.eyebrow,.sub,.line,.word,.ticker,.dot{animation:none!important} .line{stroke-dashoffset:0}}
  </style>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect width="1200" height="420" rx="22" fill="url(#grain)"/>
<path d="M28 28H1172V392H28Z" fill="none" stroke="#ffffff" stroke-opacity=".13"/>
<path d="M28 28H180M1020 392H1172" stroke="#a3e635" stroke-width="2"/>
<g class="eyebrow">
  <circle class="dot" cx="66" cy="66" r="4" fill="#a3e635"/>
  <text x="82" y="70" class="mono" font-size="11" letter-spacing="2.6" fill="#c4c7cf">JIIT NOIDA <tspan fill="#555a65">/</tspan> ELECTRONICS &amp; COMPUTER ENGINEERING</text>
  <text x="1135" y="70" text-anchor="end" class="mono" font-size="10" letter-spacing="2" fill="#777d89">PORTFOLIO · 2026</text>
</g>
<g clip-path="url(#reveal)">
  <text x="48" y="190" class="sans word" font-size="112" font-weight="850" letter-spacing="-7" fill="#f5f2e9">KAUSTUBH</text>
  <text x="52" y="278" class="sans word" font-size="86" font-weight="750" letter-spacing="-4" fill="#f5f2e9">DUA<tspan fill="#a3e635">.</tspan></text>
</g>
<text x="704" y="230" class="sans sub" font-size="18" font-weight="550" fill="#d4d6dc">I build practical software</text>
<text x="704" y="258" class="sans sub" font-size="18" font-weight="550" fill="#d4d6dc">for real-world problems.</text>
<text x="704" y="294" class="mono sub" font-size="11" letter-spacing="1.5" fill="#9297a2">AI SYSTEMS  /  DATA  /  PRODUCT ENGINEERING</text>
<path class="line" d="M54 313H1145" fill="none" stroke="url(#accent)" stroke-width="2"/>
<g clip-path="url(#ticker)">
  <g class="ticker">
    <text x="54" y="365" class="mono" font-size="12" letter-spacing="2.2" fill="#f5f2e9">BUILD WITH INTENT <tspan fill="#a3e635">✳</tspan> ENGINEER WITH CLARITY <tspan fill="#a3e635">✳</tspan> VERIFY THE DETAILS <tspan fill="#a3e635">✳</tspan> SHIP USEFUL THINGS <tspan fill="#a3e635">✳</tspan> AI · DATA · SYSTEMS <tspan fill="#a3e635">✳</tspan> </text>
    <text x="654" y="365" class="mono" font-size="12" letter-spacing="2.2" fill="#f5f2e9">BUILD WITH INTENT <tspan fill="#a3e635">✳</tspan> ENGINEER WITH CLARITY <tspan fill="#a3e635">✳</tspan> VERIFY THE DETAILS <tspan fill="#a3e635">✳</tspan> SHIP USEFUL THINGS <tspan fill="#a3e635">✳</tspan> AI · DATA · SYSTEMS <tspan fill="#a3e635">✳</tspan> </text>
  </g>
</g>
<text x="1138" y="377" text-anchor="end" class="mono" font-size="9" letter-spacing="1.5" fill="#646a75">SCROLL FOR SELECTED WORK ↓</text>
</svg>