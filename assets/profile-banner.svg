<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Nether developer portfolio</title>
<desc id="desc">An original pixel-art inspired Nether scene with an explorer, a crimson companion, a floating ghast-like creature, lava, a portal and animated embers.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090409"/><stop offset=".55" stop-color="#27070f"/><stop offset="1" stop-color="#4b0b13"/></linearGradient>
  <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#ffbd43"/><stop offset=".35" stop-color="#ff6426"/><stop offset="1" stop-color="#8d1320"/></linearGradient>
  <linearGradient id="portal" x2="0" y2="1"><stop stop-color="#ffb23c"/><stop offset=".45" stop-color="#ef3926"/><stop offset="1" stop-color="#8e1630"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="blocks" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ff9a52" stroke-opacity=".035"/></pattern>
  <style>
    .ember{animation:drift 4s ease-in-out infinite}
    .ember2{animation:drift 5.5s ease-in-out 1s infinite}
    .float{animation:bob 3.8s ease-in-out infinite}
    .float2{animation:bob 4.6s ease-in-out .7s infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .scan{animation:scan 6s linear infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes drift{0%,100%{opacity:.15;transform:translate(0,14px)}50%{opacity:1;transform:translate(12px,-20px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(580px)}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.ember,.ember2,.float,.float2,.pulse,.scan,.blink{animation:none}}
  </style>
</defs>

<rect width="1400" height="600" fill="url(#sky)"/>
<rect width="1400" height="600" fill="url(#blocks)"/>

<!-- Nether atmosphere -->
<ellipse cx="700" cy="260" rx="470" ry="230" fill="#d21f35" opacity=".10" filter="url(#blur)"/>
<ellipse cx="1100" cy="390" rx="330" ry="170" fill="#ff5b22" opacity=".08" filter="url(#blur)"/>

<!-- distant basalt architecture -->
<path d="M0 0h240l42 84-56 62 44 72-72 80 48 78-62 74 28 150H0z" fill="#171116"/>
<path d="M0 120h188l-34 56 34 56-62 66 38 62-56 72 30 60H0z" fill="#292027"/>
<path d="M1400 0h-230l-48 84 58 66-42 70 74 72-40 78 48 68-42 162h222z" fill="#151014"/>
<path d="M1400 126h-180l40 60-38 60 64 66-42 70 66 62-26 72h116z" fill="#2a2026"/>

<!-- portal aura -->
<rect x="530" y="82" width="340" height="420" rx="12" fill="#ff3d29" opacity=".13" filter="url(#blur)"/>
<rect x="555" y="75" width="290" height="420" fill="#24181c" stroke="#0a080a" stroke-width="18"/>
<rect x="576" y="96" width="248" height="378" fill="url(#portal)" stroke="#6f1b25" stroke-width="12"/>
<rect x="594" y="114" width="212" height="342" fill="#120a11" opacity=".78"/>
<path d="M600 140h200M600 174h200M600 208h200M600 242h200M600 276h200M600 310h200M600 344h200M600 378h200M600 412h200" stroke="#ff7a35" stroke-opacity=".16" stroke-width="9"/>
<g class="pulse" fill="#ffd05a"><rect x="620" y="156" width="7" height="7"/><rect x="762" y="188" width="6" height="6"/><rect x="680" y="330" width="8" height="8"/><rect x="730" y="270" width="5" height="5"/><rect x="785" y="398" width="7" height="7"/></g>

<!-- original block explorer -->
<g transform="translate(350 255)">
  <rect x="18" y="72" width="66" height="112" fill="#8c3b28"/>
  <rect x="10" y="48" width="82" height="78" fill="#c96b45"/>
  <rect x="20" y="58" width="18" height="20" fill="#221317"/><rect x="64" y="58" width="18" height="20" fill="#221317"/>
  <rect x="42" y="84" width="18" height="9" fill="#6b1e25"/>
  <rect x="2" y="126" width="98" height="22" fill="#4e2630"/>
  <rect x="22" y="148" width="24" height="82" fill="#263348"/><rect x="56" y="148" width="24" height="82" fill="#263348"/>
  <rect x="4" y="180" width="26" height="70" fill="#bd5b38"/><rect x="72" y="180" width="26" height="70" fill="#bd5b38"/>
  <rect x="27" y="230" width="20" height="18" fill="#151218"/><rect x="58" y="230" width="20" height="18" fill="#151218"/>
  <rect x="-12" y="118" width="14" height="84" fill="#6d2a25"/><rect x="98" y="118" width="14" height="84" fill="#6d2a25"/>
  <rect x="-22" y="98" width="20" height="32" fill="#e0a04b"/>
  <text x="50" y="-12" text-anchor="middle" fill="#ffd08a" font-family="monospace" font-size="12" letter-spacing="2">NETHER BUILDER</text>
</g>

<!-- floating ghast-like companion, original design -->
<g class="float" transform="translate(1020 210)">
  <rect x="0" y="0" width="126" height="92" rx="10" fill="#eee1d8" opacity=".96"/>
  <rect x="18" y="18" width="24" height="24" fill="#241319"/><rect x="84" y="18" width="24" height="24" fill="#241319"/>
  <rect x="48" y="52" width="30" height="10" fill="#b84a46"/>
  <rect x="14" y="84" width="12" height="36" fill="#d7bfb8"/><rect x="38" y="84" width="12" height="28" fill="#d7bfb8"/><rect x="78" y="84" width="12" height="30" fill="#d7bfb8"/><rect x="102" y="84" width="12" height="36" fill="#d7bfb8"/>
  <text x="63" y="-12" text-anchor="middle" fill="#ffbf76" font-family="monospace" font-size="11">COMPANION ONLINE</text>
</g>

<!-- crimson companion -->
<g class="float2" transform="translate(1160 355)">
  <rect x="16" y="28" width="68" height="76" fill="#8d2338"/>
  <rect x="8" y="8" width="84" height="68" fill="#b9364b"/>
  <rect x="22" y="25" width="16" height="18" fill="#1d0d13"/><rect x="62" y="25" width="16" height="18" fill="#1d0d13"/>
  <rect x="38" y="48" width="30" height="8" fill="#3b111d"/>
  <rect x="26" y="104" width="18" height="62" fill="#5b1b2c"/><rect x="58" y="104" width="18" height="62" fill="#5b1b2c"/>
  <text x="50" y="-8" text-anchor="middle" fill="#ffb66d" font-family="monospace" font-size="10">CRIMSON ALLY</text>
</g>

<!-- foreground terrain -->
<path d="M0 476l120-44 150 48 116-38 128 48 112-40 134 48 118-44 150 46 130-42 152 44v144H0z" fill="#0c090d"/>
<path d="M0 496l120-44 150 48 116-38 128 48 112-40 134 48 118-44 150 46 130-42 152 44" fill="none" stroke="#3c282e" stroke-width="12"/>
<path d="M0 536h1400v64H0z" fill="url(#lava)" opacity=".78"/>
<path d="M0 536h1400" stroke="#ff9d3d" stroke-width="4" opacity=".8"/>

<!-- HUD -->
<rect x="54" y="48" width="410" height="126" rx="7" fill="#09070a" fill-opacity=".94" stroke="#a72d3c" stroke-width="2"/>
<rect x="70" y="64" width="5" height="92" fill="#ff6a24"/>
<text x="94" y="91" fill="#ffb86b" font-family="monospace" font-size="13" letter-spacing="3">NETHER PROFILE · JIIT</text>
<text x="94" y="128" fill="#fff5e8" font-family="monospace" font-size="31" font-weight="700">KAUSTUBH DUA</text>
<text x="94" y="153" fill="#efc9bb" font-family="monospace" font-size="13">ECM STUDENT · SOFTWARE BUILDER</text>

<rect x="930" y="48" width="416" height="126" rx="7" fill="#09070a" fill-opacity=".94" stroke="#a72d3c" stroke-width="2"/>
<text x="956" y="80" fill="#ffb86b" font-family="monospace" font-size="12" letter-spacing="2">PLAYER LOADOUT</text>
<text x="956" y="108" fill="#f7e7dc" font-family="monospace" font-size="14">ROLE    BUILDER / EXPLORER</text>
<text x="956" y="133" fill="#f7e7dc" font-family="monospace" font-size="14">FOCUS   AI · DATA · UX · SYSTEMS</text>
<text x="956" y="158" fill="#ff6b2d" font-family="monospace" font-size="13">PORTAL  OPEN<span class="blink">_</span></text>

<!-- animated embers -->
<g fill="#ffb347">
  <rect class="ember" x="470" y="260" width="6" height="6"/><rect class="ember2" x="910" y="320" width="5" height="5"/>
  <rect class="ember" x="890" y="210" width="4" height="4"/><rect class="ember2" x="280" y="350" width="5" height="5"/>
  <rect class="ember" x="1240" y="285" width="5" height="5"/><rect class="ember2" x="1040" y="390" width="4" height="4"/>
</g>
<rect class="scan" x="0" y="0" width="1400" height="2" fill="#ff6a24" opacity=".12"/>
<text x="700" y="520" text-anchor="middle" fill="#ffe0c6" font-family="monospace" font-size="12" letter-spacing="4">SPAWN · BUILD · DEBUG · POLISH · SHIP · REPEAT</text>
</svg>