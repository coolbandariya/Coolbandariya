<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Minecraft-inspired Nether portfolio</title>
<desc id="desc">Original animated pixel-art Nether environment with a portal, basalt cliffs, lava, player HUD, hotbar and developer portfolio information.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#100813"/><stop offset=".52" stop-color="#30101d"/><stop offset="1" stop-color="#65141c"/></linearGradient>
  <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#fff38a"/><stop offset=".18" stop-color="#ffb32f"/><stop offset=".55" stop-color="#ff4b1f"/><stop offset="1" stop-color="#9f1020"/></linearGradient>
  <linearGradient id="portal" x2="0" y2="1"><stop stop-color="#d98aff"/><stop offset=".5" stop-color="#853dc0"/><stop offset="1" stop-color="#351352"/></linearGradient>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#ff7a45" stroke-opacity=".045" stroke-width="2"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  <style>
    .portal{animation:portal 2.2s steps(4,end) infinite}
    .ember{animation:ember 4s linear infinite}
    .ember2{animation:ember 5.4s linear 1.1s infinite}
    .float{animation:float 2.7s ease-in-out infinite}
    .lava{animation:flow 4.5s linear infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    .pulse{animation:pulse 1.8s steps(3,end) infinite}
    @keyframes portal{0%,100%{opacity:.72}50%{opacity:1}}
    @keyframes ember{0%{opacity:0;transform:translateY(25px)}15%{opacity:1}100%{opacity:0;transform:translateY(-150px) translateX(25px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-128px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.portal,.ember,.ember2,.float,.lava,.blink,.pulse{animation:none}}
  </style>
</defs>

<!-- sky / cavern -->
<rect width="1600" height="820" fill="url(#bg)"/>
<rect width="1600" height="820" fill="url(#grid)"/>
<ellipse cx="800" cy="360" rx="620" ry="260" fill="#c72b46" opacity=".12" filter="url(#soft)"/>
<ellipse cx="800" cy="720" rx="720" ry="180" fill="#ff351c" opacity=".2" filter="url(#soft)"/>

<!-- blocky cavern walls -->
<g fill="#09070d">
  <path d="M0 0h300l64 84-62 80 84 92-112 94 80 104-98 88 58 110 66 48H0z"/>
  <path d="M1600 0h-300l-64 84 62 80-84 92 112 94-80 104 98 88-58 110-66 48h380z"/>
</g>
<g fill="#24131d" stroke="#3b2229" stroke-width="8">
  <path d="M0 180h180l-54 70 60 82-82 86 62 90-54 74 64 86H0z"/>
  <path d="M1600 180h-180l54 70-60 82 82 86-62 90 54 74-64 86h176z"/>
</g>

<!-- basalt ceiling pillars -->
<g fill="#151018" stroke="#33202a" stroke-width="8">
  <path d="M80 0h86v190H80z"/><path d="M194 0h70v126h-70z"/><path d="M1340 0h86v176h-86z"/><path d="M1450 0h70v222h-70z"/>
</g>

<!-- distant crimson fungi -->
<g>
  <path d="M220 586h34V370h-34zM1130 590h38V382h-38z" fill="#691c31"/>
  <path d="M162 386q76-112 154 0zM1070 398q80-116 164 0z" fill="#ad2846"/>
  <g fill="#ff6366"><rect x="192" y="365" width="16" height="18"/><rect x="238" y="344" width="16" height="18"/><rect x="282" y="369" width="16" height="18"/><rect x="1092" y="376" width="16" height="18"/><rect x="1140" y="352" width="16" height="18"/><rect x="1192" y="378" width="16" height="18"/></g>
</g>

<!-- Nether portal -->
<rect x="528" y="92" width="544" height="540" fill="#b85ee8" opacity=".2" filter="url(#glow)"/>
<rect x="592" y="64" width="416" height="566" rx="6" fill="#09070d" stroke="#050309" stroke-width="34"/>
<rect x="616" y="88" width="368" height="518" fill="#1a1020" stroke="#2a1a2c" stroke-width="12"/>
<rect class="portal" x="646" y="118" width="308" height="458" fill="url(#portal)" stroke="#7437a7" stroke-width="12"/>
<path d="M680 168c66 38 104-24 174 14s80 2 70-18M680 244c76-38 110 38 182 2s70 10 60 22M680 328c70 42 110-32 180 8s72 2 62-16M680 414c76-36 108 34 182-4s70 12 60 24M680 500c70 38 110-26 180 8s72 2 62-14" fill="none" stroke="#d08af0" stroke-width="10" opacity=".58"/>
<g class="pulse" fill="#f0b4ff"><rect x="708" y="194" width="9" height="9"/><rect x="838" y="262" width="8" height="8"/><rect x="760" y="370" width="9" height="9"/><rect x="874" y="468" width="8" height="8"/></g>

<!-- original pixel explorer -->
<g transform="translate(344 386)">
  <rect x="4" y="112" width="132" height="22" fill="#4a2926"/>
  <rect x="20" y="20" width="94" height="92" fill="#c9784e"/>
  <rect x="31" y="35" width="20" height="22" fill="#1b1014"/><rect x="83" y="35" width="20" height="22" fill="#1b1014"/>
  <rect x="54" y="72" width="30" height="9" fill="#70252c"/>
  <rect x="31" y="112" width="31" height="100" fill="#263a50"/><rect x="72" y="112" width="31" height="100" fill="#263a50"/>
  <rect x="2" y="143" width="28" height="76" fill="#a94e39"/><rect x="104" y="143" width="28" height="76" fill="#a94e39"/>
  <rect x="34" y="210" width="25" height="18" fill="#0a080d"/><rect x="74" y="210" width="25" height="18" fill="#0a080d"/>
  <rect x="-22" y="86" width="21" height="96" fill="#5d292f"/><rect x="134" y="86" width="21" height="96" fill="#5d292f"/>
  <rect x="-34" y="60" width="31" height="37" fill="#e5a94f"/>
</g>

<!-- floating original companion -->
<g class="float" transform="translate(1164 258)">
  <g stroke="#f4a52f" stroke-width="8"><rect x="-28" y="26" width="20" height="70"/><rect x="156" y="26" width="20" height="70"/><rect x="36" y="-20" width="64" height="18"/><rect x="84" y="110" width="64" height="18"/></g>
  <rect x="0" y="0" width="148" height="110" fill="#d98b3c" stroke="#7b3c2b" stroke-width="8"/>
  <rect x="22" y="25" width="22" height="22" fill="#241117"/><rect x="104" y="25" width="22" height="22" fill="#241117"/>
  <rect x="56" y="64" width="36" height="9" fill="#7d2228"/>
</g>

<!-- foreground blocks -->
<path d="M0 606l142-72 178 72 134-66 152 78 132-70 162 74 134-72 166 72 136-68 164 74v104H0z" fill="#08060b"/>
<path d="M0 620l142-72 178 72 134-66 152 78 132-70 162 74 134-72 166 72 136-68 164 74" fill="none" stroke="#3a262d" stroke-width="14"/>

<!-- lava -->
<rect y="704" width="1600" height="116" fill="url(#lava)"/>
<g class="lava" opacity=".52" fill="#ffe77a">
  <path d="M0 732h120v14H0zm176 0h180v14H176zm244 0h130v14H420zm194 0h200v14H614zm270 0h150v14H884zm220 0h210v14h-210zm278 0h168v14h-168z"/>
</g>
<path d="M0 704h1600" stroke="#ffd95f" stroke-width="7"/>

<!-- game-style top HUD -->
<g font-family="monospace">
  <rect x="46" y="38" width="536" height="164" rx="4" fill="#07060a" fill-opacity=".94" stroke="#6d2732" stroke-width="4"/>
  <rect x="66" y="58" width="7" height="124" fill="#ff6a24"/>
  <text x="96" y="88" fill="#ffbd70" font-size="13" letter-spacing="3">NETHER REALM · PROFILE</text>
  <text x="96" y="136" fill="#fff4e8" font-size="34" font-weight="700">KAUSTUBH DUA</text>
  <text x="96" y="168" fill="#efc6bb" font-size="14">ECM STUDENT · SOFTWARE BUILDER</text>

  <rect x="1018" y="38" width="536" height="164" rx="4" fill="#07060a" fill-opacity=".94" stroke="#6d2732" stroke-width="4"/>
  <text x="1048" y="72" fill="#ffbd70" font-size="13" letter-spacing="2">PLAYER HUD</text>
  <text x="1048" y="105" fill="#f7e7dc" font-size="14">CLASS   ECM / BUILDER</text>
  <text x="1048" y="134" fill="#f7e7dc" font-size="14">FOCUS   AI · DATA · UX · SYSTEMS</text>
  <text x="1048" y="164" fill="#c879e8" font-size="14">PORTAL   ACTIVE<span class="blink">_</span></text>

  <!-- crosshair -->
  <g stroke="#fff1de" stroke-width="3" opacity=".7"><path d="M796 330v30M780 346h30"/></g>

  <!-- floating labels -->
  <rect x="610" y="22" width="380" height="30" fill="#07060a" fill-opacity=".82" stroke="#48202a" stroke-width="2"/>
  <text x="800" y="43" text-anchor="middle" fill="#ffd9bd" font-size="12" letter-spacing="3">SPAWN POINT · JIIT / NOIDA</text>

  <!-- hotbar -->
  <rect x="566" y="758" width="468" height="48" fill="#0a080d" fill-opacity=".95" stroke="#d2b6a5" stroke-width="3"/>
  <g stroke="#5d4b48" stroke-width="2">
    <rect x="574" y="766" width="40" height="32"/><rect x="622" y="766" width="40" height="32"/><rect x="670" y="766" width="40" height="32"/><rect x="718" y="766" width="40" height="32"/><rect x="766" y="766" width="40" height="32"/><rect x="814" y="766" width="40" height="32"/><rect x="862" y="766" width="40" height="32"/><rect x="910" y="766" width="40" height="32"/><rect x="958" y="766" width="68" height="32"/>
  </g>
  <rect x="572" y="764" width="44" height="36" fill="none" stroke="#fff0d2" stroke-width="4"/>
  <g fill="#b9b0b0">
    <rect x="585" y="778" width="18" height="10"/><rect x="633" y="778" width="18" height="10"/><rect x="681" y="778" width="18" height="10"/>
  </g>
  <g fill="#ff4c39"><path d="M1050 772l7 7 7-7 7 7 7-7 7 7 7-7v16h-42z"/></g>
</g>

<!-- embers -->
<g fill="#ffb84d"><rect class="ember" x="580" y="286" width="7" height="7"/><rect class="ember2" x="1040" y="382" width="6" height="6"/><rect class="ember" x="1118" y="320" width="5" height="5"/><rect class="ember2" x="326" y="428" width="6" height="6"/><rect class="ember" x="1412" y="380" width="6" height="6"/></g>
</svg>