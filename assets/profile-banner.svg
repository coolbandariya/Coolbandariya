<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">Kaustubh Dua — Nether themed developer profile</title>
<desc id="d">Animated original pixel-art Nether scene with an obsidian portal, lava lake, crimson fungi, a blocky explorer, a floating blaze-like companion and a developer HUD.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#120b18"/><stop offset=".5" stop-color="#2a101d"/><stop offset="1" stop-color="#5b171e"/></linearGradient>
 <linearGradient id="lava" x2="0" y2="1"><stop stop-color="#fff06a"/><stop offset=".18" stop-color="#ff9b2f"/><stop offset=".52" stop-color="#ff3d1f"/><stop offset="1" stop-color="#a31322"/></linearGradient>
 <linearGradient id="portalGlow" x2="0" y2="1"><stop stop-color="#d76cff"/><stop offset=".45" stop-color="#8b3fc4"/><stop offset="1" stop-color="#4b1d78"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="blocks" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ff6b3d" stroke-opacity=".035" stroke-width="2"/></pattern>
 <style>
  .ember{animation:rise 4s linear infinite}.ember2{animation:rise 5.2s linear 1s infinite}
  .portal{animation:portal 2.4s ease-in-out infinite}.float{animation:float 2.8s ease-in-out infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite}.blink{animation:blink 1s steps(2,end) infinite}
  .lavaflow{animation:flow 5s linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(34px)}15%{opacity:.9}100%{opacity:0;transform:translateY(-120px) translateX(22px)}}
  @keyframes portal{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-96px)}}
  @media(prefers-reduced-motion:reduce){.ember,.ember2,.portal,.float,.pulse,.blink,.lavaflow{animation:none}}
 </style>
</defs>

<!-- Nether atmosphere -->
<rect width="1600" height="760" fill="url(#sky)"/>
<rect width="1600" height="760" fill="url(#blocks)"/>
<ellipse cx="800" cy="330" rx="650" ry="300" fill="#b72b3d" opacity=".12" filter="url(#blur)"/>
<ellipse cx="800" cy="650" rx="700" ry="160" fill="#ff321d" opacity=".18" filter="url(#blur)"/>

<!-- cavern walls -->
<path d="M0 0h310l72 110-84 86 70 90-102 92 74 92-84 96 48 194H0z" fill="#100c16"/>
<path d="M0 170h235l-58 76 52 80-76 78 48 88-62 76 42 84H0z" fill="#261820"/>
<path d="M1600 0h-310l-72 110 84 86-70 90 102 92-74 92 84 96-48 194h304z" fill="#100c16"/>
<path d="M1600 170h-235l58 76-52 80 76 78-48 88 62 76-42 84h181z" fill="#261820"/>

<!-- hanging basalt -->
<g fill="#18121a" stroke="#34242b" stroke-width="8">
 <path d="M92 0h92v184H92z"/><path d="M204 0h76v132h-76z"/><path d="M1300 0h92v158h-92z"/><path d="M1410 0h76v210h-76z"/>
</g>

<!-- crimson forest -->
<g>
 <path d="M238 566h34V350h-34z" fill="#651c30"/><path d="M184 360q70-102 142 0z" fill="#b32643"/>
 <path d="M1140 570h38V360h-38z" fill="#651c30"/><path d="M1080 372q78-112 158 0z" fill="#b32643"/>
 <g fill="#ff5c62"><rect x="204" y="345" width="16" height="18"/><rect x="246" y="325" width="16" height="18"/><rect x="286" y="350" width="16" height="18"/><rect x="1104" y="356" width="16" height="18"/><rect x="1150" y="332" width="16" height="18"/><rect x="1190" y="358" width="16" height="18"/></g>
</g>

<!-- obsidian Nether portal -->
<rect x="522" y="82" width="556" height="520" fill="#6e32a6" opacity=".22" filter="url(#blur)"/>
<rect x="596" y="62" width="408" height="548" fill="#100b16" stroke="#050309" stroke-width="34"/>
<rect x="616" y="82" width="368" height="508" fill="#1a1023" stroke="#17111c" stroke-width="12"/>
<rect class="portal" x="646" y="112" width="308" height="448" fill="url(#portalGlow)" stroke="#7d3bb0" stroke-width="10"/>
<rect x="675" y="141" width="250" height="390" fill="#241036" opacity=".92"/>
<path d="M684 164c80 40 110-24 184 14s70 6 54-10M684 232c68-32 112 38 184 4s74 10 54 24M684 316c84 42 116-34 186 6s66 4 52-12M684 400c76-38 112 32 186-4s68 10 52 22M684 484c80 36 116-26 186 8s66 4 52-10" fill="none" stroke="#b968e4" stroke-width="9" opacity=".55"/>
<g class="portal" fill="#e6a5ff"><rect x="710" y="186" width="8" height="8"/><rect x="842" y="248" width="7" height="7"/><rect x="768" y="358" width="8" height="8"/><rect x="880" y="446" width="7" height="7"/></g>

<!-- original blocky explorer -->
<g transform="translate(360 350)">
 <rect x="8" y="106" width="120" height="24" fill="#4a2a25"/>
 <rect x="20" y="24" width="88" height="84" fill="#c8754e"/>
 <rect x="30" y="38" width="18" height="20" fill="#201117"/><rect x="80" y="38" width="18" height="20" fill="#201117"/>
 <rect x="52" y="70" width="24" height="9" fill="#6e222b"/>
 <rect x="32" y="108" width="30" height="96" fill="#25384c"/><rect x="68" y="108" width="30" height="96" fill="#25384c"/>
 <rect x="4" y="138" width="28" height="74" fill="#a84e39"/><rect x="98" y="138" width="28" height="74" fill="#a84e39"/>
 <rect x="34" y="200" width="24" height="18" fill="#0d0b10"/><rect x="70" y="200" width="24" height="18" fill="#0d0b10"/>
 <rect x="-20" y="84" width="20" height="92" fill="#5e282d"/><rect x="128" y="84" width="20" height="92" fill="#5e282d"/>
 <rect x="-32" y="58" width="30" height="36" fill="#e3a64d"/>
</g>

<!-- floating original blaze-like companion -->
<g class="float" transform="translate(1180 238)">
 <g stroke="#f5a52f" stroke-width="8"><rect x="-28" y="28" width="20" height="64"/><rect x="156" y="28" width="20" height="64"/><rect x="36" y="-18" width="64" height="18"/><rect x="84" y="106" width="64" height="18"/></g>
 <rect x="0" y="0" width="148" height="108" fill="#d88b3c" stroke="#7c3d2c" stroke-width="8"/>
 <rect x="22" y="24" width="22" height="22" fill="#241117"/><rect x="104" y="24" width="22" height="22" fill="#241117"/>
 <rect x="56" y="62" width="36" height="9" fill="#7d2228"/>
</g>

<!-- foreground cliffs -->
<path d="M0 582l150-72 170 72 134-64 152 76 132-68 160 72 136-70 164 70 136-66 166 72v158H0z" fill="#09070c"/>
<path d="M0 606l150-72 170 72 134-64 152 76 132-68 160 72 136-70 164 70 136-66 166 72" fill="none" stroke="#3a272e" stroke-width="14"/>

<!-- lava lake -->
<rect y="650" width="1600" height="110" fill="url(#lava)"/>
<g class="lavaflow" opacity=".55" fill="#ffe46b"><path d="M0 675h96v14H0zm160 0h180v14H160zm244 0h120v14H404zm188 0h190v14H592zm258 0h150v14H850zm214 0h190v14h-190zm254 0h160v14h-160z"/></g>
<path d="M0 650h1600" stroke="#ffd55c" stroke-width="6"/>

<!-- HUD panels -->
<g font-family="monospace">
 <rect x="48" y="42" width="510" height="150" rx="8" fill="#07060a" fill-opacity=".94" stroke="#8f263b" stroke-width="3"/>
 <rect x="68" y="62" width="6" height="110" fill="#ff6a24"/>
 <text x="98" y="92" fill="#ffbf72" font-size="14" letter-spacing="3">NETHER PROFILE · JIIT</text>
 <text x="98" y="140" fill="#fff5e9" font-size="34" font-weight="700">KAUSTUBH DUA</text>
 <text x="98" y="170" fill="#f0c8bd" font-size="14">ECM STUDENT · SOFTWARE BUILDER</text>
 <rect x="1040" y="42" width="512" height="150" rx="8" fill="#07060a" fill-opacity=".94" stroke="#8f263b" stroke-width="3"/>
 <text x="1070" y="78" fill="#ffbf72" font-size="13" letter-spacing="2">PLAYER LOADOUT</text>
 <text x="1070" y="110" fill="#f7e7dc" font-size="15">CLASS   ECM / BUILDER</text>
 <text x="1070" y="140" fill="#f7e7dc" font-size="15">FOCUS   AI · DATA · UX · SYSTEMS</text>
 <text x="1070" y="171" fill="#b968e4" font-size="14">PORTAL  ACTIVE<span class="blink">_</span></text>
 <text x="800" y="628" text-anchor="middle" fill="#ffe0c6" font-size="13" letter-spacing="5">SPAWN · BUILD · DEBUG · POLISH · SHIP · REPEAT</text>
</g>

<!-- embers -->
<g fill="#ffb347"><rect class="ember" x="580" y="280" width="7" height="7"/><rect class="ember2" x="1040" y="360" width="6" height="6"/><rect class="ember" x="1120" y="310" width="5" height="5"/><rect class="ember2" x="330" y="410" width="6" height="6"/><rect class="ember" x="1410" y="360" width="6" height="6"/></g>
</svg>