<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — animated developer profile banner</title>
<desc id="desc">Minimal dark developer banner with animated aurora gradients, subtle grid, signal lines and engineering nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#090d18"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#22c55e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8" stop-opacity="0"/><stop offset=".35" stop-color="#38bdf8" stop-opacity=".75"/><stop offset=".65" stop-color="#a78bfa" stop-opacity=".75"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
  <style>
    .orb{animation:drift 8s ease-in-out infinite}
    .orb2{animation:drift2 11s ease-in-out infinite}
    .scan{animation:scan 4s linear infinite}
    .signal{stroke-dasharray:8 16;animation:dash 3s linear infinite}
    .node{animation:pulse 2.4s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,24px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-20px)}}
    @keyframes scan{from{transform:translateX(-420px)}to{transform:translateX(1800px)}}
    @keyframes dash{to{stroke-dashoffset:-48}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.orb,.orb2,.scan,.signal,.node{animation:none}}
  </style>
</defs>

<rect width="1600" height="520" fill="url(#bg)"/>
<rect width="1600" height="520" fill="url(#grid)"/>

<g class="orb" filter="url(#blur)" opacity=".28">
  <ellipse cx="390" cy="230" rx="330" ry="150" fill="#7c3aed"/>
  <ellipse cx="1120" cy="250" rx="350" ry="170" fill="#0ea5e9"/>
</g>
<g class="orb2" filter="url(#blur)" opacity=".16">
  <ellipse cx="820" cy="80" rx="420" ry="100" fill="#22c55e"/>
</g>

<path d="M-60 370 C180 250 310 470 540 340 S920 190 1120 310 S1390 470 1660 250" fill="none" stroke="url(#line)" stroke-width="2" opacity=".9"/>
<path class="signal" d="M-60 370 C180 250 310 470 540 340 S920 190 1120 310 S1390 470 1660 250" fill="none" stroke="#c4b5fd" stroke-width="1" opacity=".5"/>

<g fill="#e2e8f0">
  <circle class="node" cx="250" cy="326" r="4"/><circle class="node" cx="548" cy="337" r="4"/>
  <circle class="node" cx="824" cy="245" r="4"/><circle class="node" cx="1125" cy="310" r="4"/>
  <circle class="node" cx="1390" cy="357" r="4"/>
</g>

<g opacity=".28" stroke="#64748b" fill="none">
  <path d="M80 80h240l28 28h150"/>
  <path d="M1260 110h180l34 34h90"/>
  <path d="M105 430h190l28-28h160"/>
  <path d="M1250 420h150l35-35h110"/>
</g>

<rect class="scan" x="0" y="0" width="420" height="520" fill="url(#aurora)" opacity=".035"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="86" y="110" fill="#94a3b8" font-size="14" letter-spacing="4">ENGINEERING · SOFTWARE · OPEN SOURCE</text>
  <text x="82" y="190" fill="#f8fafc" font-size="56" font-weight="750">KAUSTUBH DUA</text>
  <text x="86" y="230" fill="#cbd5e1" font-size="20">Electronics &amp; Computer Engineering · JIIT Noida</text>
  <text x="86" y="286" fill="#94a3b8" font-size="15">AI  ·  DATA  ·  MAPS  ·  AUTOMATION  ·  PRODUCT ENGINEERING</text>

  <rect x="86" y="332" width="178" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="108" cy="351" r="5" fill="#22c55e"/>
  <text x="124" y="357" fill="#e2e8f0" font-size="13">BUILDING IN PUBLIC</text>

  <text x="86" y="430" fill="#64748b" font-size="12" letter-spacing="2">CURIOUS BY DEFAULT · DELIBERATE BY DESIGN</text>
</g>
</svg>