<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — Nether-inspired developer portfolio</title>
<desc id="desc">Original pixel-art-inspired Nether scene with basalt cliffs, crimson fungi, lava, a glowing portal, particles and a game-style developer HUD.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1">
    <stop stop-color="#09070b"/><stop offset=".42" stop-color="#1b0b12"/><stop offset="1" stop-color="#4a1019"/>
  </linearGradient>
  <linearGradient id="lava" x2="0" y2="1">
    <stop stop-color="#ffd15a"/><stop offset=".18" stop-color="#ff7a24"/><stop offset=".55" stop-color="#df3327"/><stop offset="1" stop-color="#7c1425"/>
  </linearGradient>
  <linearGradient id="portal" x2="0" y2="1">
    <stop stop-color="#ffcf62"/><stop offset=".2" stop-color="#ff6b2d"/><stop offset=".7" stop-color="#b51f3a"/><stop offset="1" stop-color="#58162a"/>
  </linearGradient>
  <linearGradient id="crimson" x2="0" y2="1">
    <stop stop-color="#f04a4b"/><stop offset="1" stop-color="#76182d"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffb35c" stroke-opacity=".035"/>
  </pattern>
  <style>
    .ember{animation:ember 4s ease-in-out infinite}
    .ember2{animation:ember 5.5s ease-in-out 1.2s infinite}
    .float{animation:float 4s ease-in-out infinite}
    .pulse{animation:pulse 2s ease-in-out infinite}
    .scan{animation:scan 7s linear infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes ember{0%,100%{opacity:.15;transform:translate(0,16px)}50%{opacity:1;transform:translate(14px,-22px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(740px)}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.ember,.ember2,.float,.pulse,.scan,.blink{animation:none}}
  </style>
</defs>

<!-- atmosphere -->
<rect width="1600" height="720" fill="url(#bg)"/>
<rect width="1600" height="720" fill="url(#grid)"/>
<ellipse cx="800" cy="320" rx="560" ry="280" fill="#d3273b" opacity=".11" filter="url(#soft)"/>
<ellipse cx="1260" cy="510" rx="390" ry="190" fill="#ff5b22" opacity=".09" filter="url(#soft)"/>

<!-- basalt deltas / blackstone silhouettes -->
<path d="M0 0h300l58 104-72 92 62 86-92 90 68 100-78 82 42 166H0z" fill="#111014"/>
<path d="M0 160h236l-52 76 46 74-74 74 44 82-58 78 36 72H0z" fill="#252025"/>
<path d="M1600 0h-300l-62 112 74 86-66 88 96 86-74 100 82 84-46 164h296z" fill="#100e12"/>
<path d="M1600 158h-230l54 78-50 72 78 78-48 82 62 72-42 84h176z" fill="#262126"/>

<!-- basalt columns -->
<g fill="#17151a" stroke="#32262d" stroke-width="8">
  <path d="M104 350h80v170h-80z"/><path d="M190 300h74v220h-74z"/><path d="M1280 326h86v194h-86z"/><path d="M1380 286h76v234h-76z"/>
</g>

<!-- crimson fungi -->
<g opacity=".96">
  <path d="M270 505h32V318h-32z" fill="#6e1a2e"/>
  <path d="M224 330q62-86 124 0z" fill="url(#crimson)"/>
  <path d="M234 322h18v20h-18zm30-18h18v20h-18zm30 24h18v20h-18z" fill="#ff6a55"/>
  <path d="M1180 520h38V338h-38z" fill="#64182b"/>
  <path d="M1120 350q78-102 156 0z" fill="url(#crimson)"/>
  <path d="M1142 340h18v20h-18zm42-20h18v20h-18zm38 22h18v20h-18z" fill="#ff6a55"/>
</g>

<!-- portal -->
<rect x="548" y="88" width="504" height="470" rx="16" fill="#ff432b" opacity=".11" filter="url(#soft)"/>
<rect x="602" y="70" width="396" height="500" fill="#151117" stroke="#08070a" stroke-width="26"/>
<rect x="630" y="98" width="340" height="444" fill="url(#portal)" stroke="#72192c" stroke-width="16"/>
<rect x="660" y="128" width="280" height="384" fill="#100a12"/>
<g opacity=".42" stroke="#ff8a3b" stroke-width="12">
  <path d="M672 156h256M672 198h256M672 240h256M672 282h256M672 324h256M672 366h256M672 408h256M672 450h256"/>
</g>
<g class="pulse" fill="#ffd36a">
  <rect x="702" y="168" width="8" height="8"/><rect x="860" y="212" width="6" height="6"/>
  <rect x="760" y="330" width="8" height="8"/><rect x="830" y="390" width="6" height="6"/>
  <rect x="716" y="430" width="7" height="7"/><rect x="890" y="462" width="8" height="8"/>
</g>

<!-- original explorer silhouette -->
<g transform="translate(400 310)">
  <rect x="0" y="105" width="116" height="30" fill="#3a2227"/>
  <rect x="16" y="30" width="84" height="78" fill="#c86d48"/>
  <rect x="26" y="42" width="18" height="20" fill="#211116"/><rect x="72" y="42" width="18" height="20" fill="#211116"/>
  <rect x="48" y="72" width="22" height="9" fill="#6b1e25"/>
  <rect x="28" y="108" width="28" height="92" fill="#2a354b"/><rect x="62" y="108" width="28" height="92" fill="#2a354b"/>
  <rect x="6" y="138" width="28" height="74" fill="#b9573a"/><rect x="84" y="138" width="28" height="74" fill="#b9573a"/>
  <rect x="30" y="196" width="24" height="18" fill="#111016"/><rect x="64" y="196" width="24" height="18" fill="#111016"/>
  <rect x="-20" y="92" width="18" height="86" fill="#68292a"/><rect x="116" y="92" width="18" height="86" fill="#68292a"/>
  <rect x="-30" y="70" width="26" height="34" fill="#e3a44e"/>
</g>

<!-- floating companion -->
<g class="float" transform="translate(1190 190)">
  <rect x="0" y="0" width="148" height="108" rx="10" fill="#eadfd8"/>
  <rect x="20" y="22" width="26" height="26" fill="#241319"/><rect x="102" y="22" width="26" height="26" fill="#241319"/>
  <rect x="56" y="62" width="36" height="10" fill="#b34b47"/>
  <rect x="16" y="98" width="14" height="42" fill="#d1b9b1"/><rect x="46" y="98" width="14" height="34" fill="#d1b9b1"/>
  <rect x="88" y="98" width="14" height="36" fill="#d1b9b1"/><rect x="118" y="98" width="14" height="42" fill="#d1b9b1"/>
</g>

<!-- foreground -->
<path d="M0 566l148-58 170 58 134-52 152 64 132-56 160 60 136-58 164 58 136-54 168 58v154H0z" fill="#0a080d"/>
<path d="M0 590l148-58 170 58 134-52 152 64 132-56 160 60 136-58 164 58 136-54 168 58" fill="none" stroke="#3a292f" stroke-width="14"/>
<path d="M0 650h1600v70H0z" fill="url(#lava)" opacity=".84"/>
<path d="M0 650h1600" stroke="#ffae45" stroke-width="5" opacity=".85"/>

<!-- HUD -->
<g>
  <rect x="54" y="48" width="490" height="146" rx="8" fill="#08070a" fill-opacity=".95" stroke="#9e2a3d" stroke-width="3"/>
  <rect x="72" y="68" width="6" height="106" fill="#ff6a24"/>
  <text x="100" y="98" fill="#ffbd73" font-family="monospace" font-size="14" letter-spacing="3">NETHER PROFILE · JIIT</text>
  <text x="100" y="143" fill="#fff5e8" font-family="monospace" font-size="34" font-weight="700">KAUSTUBH DUA</text>
  <text x="100" y="172" fill="#efc9bb" font-family="monospace" font-size="14">ECM STUDENT · SOFTWARE BUILDER</text>
</g>

<g>
  <rect x="1056" y="48" width="490" height="146" rx="8" fill="#08070a" fill-opacity=".95" stroke="#9e2a3d" stroke-width="3"/>
  <text x="1084" y="82" fill="#ffbd73" font-family="monospace" font-size="13" letter-spacing="2">PLAYER LOADOUT</text>
  <text x="1084" y="112" fill="#f7e7dc" font-family="monospace" font-size="15">CLASS   ECM / BUILDER</text>
  <text x="1084" y="140" fill="#f7e7dc" font-family="monospace" font-size="15">FOCUS   AI · DATA · UX · SYSTEMS</text>
  <text x="1084" y="170" fill="#ff7134" font-family="monospace" font-size="14">PORTAL  OPEN<span class="blink">_</span></text>
</g>

<!-- particles -->
<g fill="#ffb347">
  <rect class="ember" x="570" y="250" width="7" height="7"/><rect class="ember2" x="1040" y="318" width="5" height="5"/>
  <rect class="ember" x="1090" y="250" width="5" height="5"/><rect class="ember2" x="340" y="380" width="6" height="6"/>
  <rect class="ember" x="1420" y="300" width="6" height="6"/><rect class="ember2" x="1080" y="430" width="5" height="5"/>
</g>

<!-- scanline -->
<rect class="scan" x="0" y="0" width="1600" height="3" fill="#ff6a24" opacity=".12"/>

<text x="800" y="626" text-anchor="middle" fill="#ffe0c6" font-family="monospace" font-size="13" letter-spacing="5">SPAWN · BUILD · DEBUG · POLISH · SHIP · REPEAT</text>
</svg>