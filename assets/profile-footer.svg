<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
<title id="title">Build thoughtfully. Verify everything.</title>
<desc id="desc">A restrained monochrome footer with a line that draws across and a blinking engineering status indicator.</desc>
<defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .draw{stroke-dasharray:980;stroke-dashoffset:980;animation:draw 5s ease-in-out infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .cursor{animation:cursor 1.1s steps(2,end) infinite}.spark{stroke:#f4efe5;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:3 10;animation:spark 4.5s linear infinite}.footer-dot{fill:#f4efe5;animation:pulse 1.8s ease-in-out infinite}
    @keyframes draw{0%,10%{stroke-dashoffset:980;opacity:.3}65%,100%{stroke-dashoffset:0;opacity:.75}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes cursor{50%{opacity:0}}@keyframes spark{from{stroke-dashoffset:0;opacity:.15}50%{opacity:.75}to{stroke-dashoffset:-180;opacity:.15}}
    @media(prefers-reduced-motion:reduce){.draw,.pulse,.cursor,.spark,.footer-dot{animation:none!important}.draw{stroke-dashoffset:0}.pulse{opacity:1}.cursor{opacity:1}}
  </style>
</defs>
<rect width="1200" height="92" rx="8" fill="#100e10"/>
<path d="M24 18H1176" stroke="#e9e2d7" stroke-opacity=".18"/>
<circle class="pulse" cx="34" cy="48" r="3.5" fill="#f4efe5"/><circle class="footer-dot" cx="270" cy="48" r="2.5"/>
<text x="52" y="52" class="mono" font-size="12" letter-spacing="2" fill="#b9b1a5">END OF TRANSMISSION</text>
<path class="draw" d="M270 48H1084" stroke="#e9e2d7" stroke-width="1" fill="none"/><path class="spark" d="M270 48H1084" fill="none"/>
<text x="1100" y="52" class="mono" font-size="12" letter-spacing="1" fill="#f4efe5">READY</text>
<rect class="cursor" x="1164" y="39" width="3" height="18" fill="#f4efe5"/>
<text x="24" y="78" class="mono" font-size="10" letter-spacing="1.4" fill="#77716b">BUILD THOUGHTFULLY. VERIFY EVERYTHING.</text>
<text x="1176" y="78" class="mono" font-size="10" letter-spacing="1.4" fill="#77716b" text-anchor="end">KAUSTUBH DUA / ECM</text>
</svg>