<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-labelledby="title desc">
<title id="title">Guitar and music</title>
<desc id="desc">Minimal line-art electric guitar with animated strings and a subtle sound waveform.</desc>
<defs><linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#777"/><stop offset=".5" stop-color="#eee"/><stop offset="1" stop-color="#777"/></linearGradient></defs>
<style>
.panel{fill:#101010;stroke:#3a3a3a;stroke-width:1.5}.wire{fill:none;stroke:#777;stroke-width:1.4}.bright{fill:none;stroke:#eee;stroke-width:1.7;stroke-linecap:round}.label{fill:#f0eee8;font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px}.muted{fill:#9d9d9d;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.string{stroke:#bbb;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pluck 1.6s ease-in-out infinite}.wave{fill:none;stroke:#eee;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 8;animation:wave 5s linear infinite}@keyframes pluck{0%,100%{transform:skewY(0);opacity:.55}20%{transform:skewY(2deg);opacity:1}40%{transform:skewY(-1.4deg);opacity:.8}60%{transform:skewY(.5deg);opacity:.65}}@keyframes wave{to{stroke-dashoffset:-110}}
@media(prefers-reduced-motion:reduce){.string,.wave{animation:none}}
</style>
<rect class="panel" x="1" y="1" width="1198" height="124" rx="12"/>
<g transform="translate(52 17)">
  <path class="wire" stroke-width="3" d="M42 19 C29 9 14 19 15 33 C16 42 26 47 33 43 C42 37 47 44 42 54 C37 64 44 79 58 80 C72 81 79 67 71 56 C65 48 70 40 80 42 C92 44 100 31 92 20 C83 8 67 12 61 22 C56 29 49 26 42 19Z"/>
  <circle cx="53" cy="46" r="13" fill="#181818" stroke="#aaa" stroke-width="2"/>
  <path class="bright" d="M51 4 L62 93 M57 4 L68 93 M63 5 L74 92 M69 7 L80 90"/>
  <path class="wire" d="M50 45 L144 19 M56 50 L150 24 M62 55 L156 29 M68 60 L162 34"/>
  <rect x="137" y="13" width="28" height="28" rx="4" fill="#222" stroke="#aaa" stroke-width="1.5" transform="rotate(-15 151 27)"/>
  <path class="string" d="M22 23 L160 2"/><path class="string" style="animation-delay:.2s" d="M20 29 L163 8"/><path class="string" style="animation-delay:.4s" d="M21 35 L166 14"/><path class="string" style="animation-delay:.6s" d="M25 41 L168 20"/>
</g>
<g transform="translate(300 0)">
  <text class="label" x="0" y="48">NOW PLAYING</text>
  <text class="muted" x="0" y="72">GUITAR · MUSIC · CREATIVE RESET</text>
  <path class="wave" d="M0 96 L20 96 L29 88 L38 104 L48 80 L58 108 L69 91 L79 96 L98 96 L108 86 L117 103 L128 78 L138 110 L149 92 L159 96 L180 96 L192 89 L201 102 L212 82 L223 106 L234 92 L246 96 L266 96 L278 88 L288 104 L298 84 L309 108 L320 92 L332 96 L352 96 L364 89 L375 103 L386 83 L397 108 L408 92 L420 96 L440 96 L452 88 L463 104 L474 82 L485 108 L496 92 L508 96 L530 96 L542 88 L553 104 L564 82 L575 108 L586 92 L598 96 L620 96 L632 88 L643 104 L654 82 L665 108 L676 92 L688 96 L710 96 L722 88 L733 104 L744 82 L755 108 L766 92 L778 96 L800 96"/>
</g>
</svg>