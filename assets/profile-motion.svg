<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="88" viewBox="0 0 1536 88" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — build loop</title>
<desc id="desc">A minimal animated monochrome status strip with rotating engineering themes and a subtle lime scan line.</desc>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9f99d" stop-opacity="0"/><stop offset=".5" stop-color="#d9f99d"/><stop offset="1" stop-color="#d9f99d" stop-opacity="0"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .phrase{opacity:0;animation:rotate 12s linear infinite}
    .p2{animation-delay:4s}.p3{animation-delay:8s}
    .scan{animation:scan 6s ease-in-out infinite}
    .dot{animation:blink 2s ease-in-out infinite}
    @keyframes rotate{0%,3%{opacity:0;transform:translateY(5px)}8%,27%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-4px)}}
    @keyframes scan{0%{transform:translateX(-300px);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateX(1536px);opacity:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.phrase,.scan,.dot{animation:none!important}.phrase{opacity:0}.p1{opacity:1}}
  </style>
</defs>
<rect width="1536" height="88" rx="10" fill="#100e12"/>
<path d="M22 1H1514M22 87H1514" stroke="#e9e2d7" stroke-opacity=".18"/>
<circle class="dot" cx="42" cy="44" r="4" fill="#d9f99d"/>
<text x="61" y="48" class="mono" font-size="12" letter-spacing="2" fill="#b9b1a5">BUILD LOG</text>
<path d="M177 44H272" stroke="#e9e2d7" stroke-opacity=".35"/>
<text x="298" y="48" class="mono" font-size="15" letter-spacing="1.2" fill="#f4efe5">01 /</text>
<g class="mono" font-size="15" letter-spacing="1.5" fill="#f4efe5">
  <text class="phrase p1" x="350" y="48">Turning complex problems into useful products</text>
  <text class="phrase p2" x="350" y="48">Making AI systems practical, testable and local</text>
  <text class="phrase p3" x="350" y="48">Connecting data, decisions and real workflows</text>
</g>
<path d="M1010 44H1455" stroke="#e9e2d7" stroke-opacity=".25" stroke-dasharray="2 7"/>
<text x="1486" y="48" class="mono" font-size="12" letter-spacing="1" fill="#b9b1a5" text-anchor="end">ITERATE ↗</text>
<path class="scan" d="M0 84H300" stroke="url(#line)" stroke-width="2"/>
</svg>