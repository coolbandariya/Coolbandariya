<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="88" viewBox="0 0 1536 88" role="img" aria-labelledby="title desc">
<title id="title">Kaustubh Dua — engineering build log</title>
<desc id="desc">A monochrome animated engineering status strip with rotating product-building themes, fine technical rules and a subtle moving scan line.</desc>
<defs>
  <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4efe5" stop-opacity="0"/><stop offset=".5" stop-color="#f4efe5" stop-opacity=".9"/><stop offset="1" stop-color="#f4efe5" stop-opacity="0"/></linearGradient>
  <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4efe5" stop-opacity="0"/><stop offset=".5" stop-color="#f4efe5" stop-opacity=".55"/><stop offset="1" stop-color="#f4efe5" stop-opacity="0"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .phrase{opacity:0;animation:rotate 15s linear infinite}
    .p2{animation-delay:5s}.p3{animation-delay:10s}
    .scan{animation:scan 8s ease-in-out infinite}
    .dot{animation:blink 2.4s ease-in-out infinite}
    .trace{stroke-dasharray:3 10;animation:flow 12s linear infinite}
    @keyframes rotate{0%,3%{opacity:0;transform:translateY(4px)}8%,25%{opacity:1;transform:translateY(0)}30%,100%{opacity:0;transform:translateY(-3px)}}
    @keyframes scan{0%{transform:translateX(-320px);opacity:0}15%{opacity:.55}85%{opacity:.55}100%{transform:translateX(1536px);opacity:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-156}}
    @media(prefers-reduced-motion:reduce){.phrase,.scan,.dot,.trace{animation:none!important}.phrase{opacity:0}.p1{opacity:1}.scan{display:none}}
  </style>
</defs>
<rect width="1536" height="88" rx="8" fill="#100e10"/>
<path d="M22 1H1514M22 87H1514" stroke="#e9e2d7" stroke-opacity=".2"/>
<path class="trace" d="M24 15H1512M24 73H1512" fill="none" stroke="url(#trace)" stroke-width="1"/>
<circle class="dot" cx="42" cy="44" r="3.5" fill="#f4efe5"/>
<text x="61" y="48" class="mono" font-size="12" letter-spacing="2" fill="#b9b1a5">BUILD LOG</text>
<path d="M177 44H272" stroke="#e9e2d7" stroke-opacity=".35"/>
<text x="298" y="48" class="mono" font-size="15" letter-spacing="1.2" fill="#f4efe5">01 /</text>
<g class="mono" font-size="15" letter-spacing="1.2" fill="#f4efe5">
  <text class="phrase p1" x="350" y="48">Turning complex problems into useful products</text>
  <text class="phrase p2" x="350" y="48">Making AI systems practical, testable and local</text>
  <text class="phrase p3" x="350" y="48">Connecting data, decisions and real workflows</text>
</g>
<path d="M1010 44H1455" stroke="#e9e2d7" stroke-opacity=".25" stroke-dasharray="2 7"/>
<text x="1486" y="48" class="mono" font-size="12" letter-spacing="1" fill="#b9b1a5" text-anchor="end">ITERATE ↗</text>
<path class="scan" d="M0 84H320" stroke="url(#scanline)" stroke-width="2"/>
</svg>