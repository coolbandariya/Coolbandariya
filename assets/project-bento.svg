<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Animated project bento</title><desc id="d">Four selected engineering projects presented as animated product cards with live-looking status indicators and evidence lines.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><linearGradient id="a"><stop stop-color="#0f766e"/><stop offset=".5" stop-color="#0284c7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><style>.a{animation:f 14s cubic-bezier(.39,.24,.3,1) infinite}.b{animation:f 14s 1s cubic-bezier(.39,.24,.3,1) infinite}.c{animation:f 14s 2s cubic-bezier(.39,.24,.3,1) infinite}.d{animation:f 14s 3s cubic-bezier(.39,.24,.3,1) infinite}.dot{animation:q 1.8s cubic-bezier(.39,.24,.3,1) infinite}.dot2{animation:q 1.8s .20s cubic-bezier(.39,.24,.3,1) infinite}.shine{animation:sh 42s cubic-bezier(.39,.24,.3,1) infinite}@keyframes f{50%{transform:translateY(-6px)}}@keyframes q{50%{opacity:.25;transform:scale(.7)}}@keyframes sh{0%,100%{transform:translateX(-260px);opacity:0}25%,70%{opacity:.45}55%{transform:translateX(1100px)}}@media(prefers-reduced-motion:reduce){.a,.b,.c,.d,.dot,.dot2,.shine{animation:none}}</style></defs><rect width="1200" height="410" rx="24" fill="url(#bg)" stroke="#dbe3ec"/><g font-family="Inter,ui-sans-serif,system-ui,sans-serif"><text x="44" y="38" font-size="11" fill="#64748b" letter-spacing="2.8">SELECTED WORK / PRODUCT INDEX</text><text x="44" y="62" font-size="20" fill="#0f172a">Four systems. Four different constraints.</text><g class="a"><rect x="44" y="84" width="540" height="128" rx="18" fill="#07111f"/><text x="68" y="111" font-size="10" fill="#38bdf8" letter-spacing="2">01 / GITGLOBE</text><text x="68" y="143" font-size="19" fill="#f8fafc">Open-source discovery</text><text x="68" y="166" font-size="11" fill="#94a3b8">semantic embeddings · spherical UMAP · WebGL</text><text x="68" y="190" font-size="10" fill="#64748b">198,731 repositories <tspan fill="#38bdf8">↗ inspect</tspan></text><circle class="dot" cx="554" cy="111" r="5" fill="#38bdf8"/></g><g class="b"><rect x="616" y="84" width="540" height="128" rx="18" fill="#ffffff" stroke="#dbe3ec"/><text x="640" y="111" font-size="10" fill="#0f766e" letter-spacing="2">02 / NIRDHOOM</text><text x="640" y="143" font-size="19" fill="#0f172a">Field operations</text><text x="640" y="166" font-size="11" fill="#64748b">booking · evidence · dispatch · OR-Tools</text><text x="640" y="190" font-size="10" fill="#64748b">field-first workflow <tspan fill="#0f766e">↗ inspect</tspan></text><circle class="dot2" cx="1126" cy="111" r="5" fill="#0f766e"/></g><g class="c"><rect x="44" y="236" width="540" height="128" rx="18" fill="#ffffff" stroke="#dbe3ec"/><text x="68" y="263" font-size="10" fill="#7c3aed" letter-spacing="2">03 / SAATHI</text><text x="68" y="295" font-size="19" fill="#0f172a">Voice + AI</text><text x="68" y="318" font-size="11" fill="#64748b">routing · consent · provider adapters · escalation</text><text x="68" y="342" font-size="10" fill="#64748b">source-backed assistance <tspan fill="#7c3aed">↗ inspect</tspan></text><circle class="dot" cx="554" cy="263" r="5" fill="#7c3aed"/></g><g class="d"><rect x="616" y="236" width="540" height="128" rx="18" fill="#07111f"/><text x="640" y="263" font-size="10" fill="#22c55e" letter-spacing="2">04 / JYC 128</text><text x="640" y="295" font-size="19" fill="#f8fafc">Production web</text><text x="640" y="318" font-size="11" fill="#94a3b8">accessibility · provenance · CI · CodeQL · QA</text><text x="640" y="342" font-size="10" fill="#64748b">public product engineering <tspan fill="#22c55e">↗ inspect</tspan></text><circle class="dot2" cx="1126" cy="263" r="5" fill="#22c55e"/></g><rect class="shine" x="0" y="0" width="180" height="410" fill="#fff" opacity=".12" transform="skewX(-18)"/></g></svg>