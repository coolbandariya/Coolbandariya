<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Animated selected project system</title><desc id="d">A unified dark glass bento showcase of four engineering projects with slow depth motion, soft spotlight and evidence-focused typography.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="g2"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="gl"><stop stop-color="#38bdf8" stop-opacity=".12"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".035"/></pattern><style>.a{animation:f 16s cubic-bezier(.39,.24,.3,1) infinite}.b{animation:f 16s 2.5s cubic-bezier(.39,.24,.3,1) infinite}.c{animation:f 16s 5s cubic-bezier(.39,.24,.3,1) infinite}.d{animation:f 16s 7.5s cubic-bezier(.39,.24,.3,1) infinite}.beam{animation:beam 54s cubic-bezier(.39,.24,.3,1) infinite}@keyframes f{50%{transform:translateY(-5px)}}@keyframes beam{0%,100%{transform:translateX(-260px);opacity:0}30%,70%{opacity:.28}50%{transform:translateX(1200px)}}@media(prefers-reduced-motion:reduce){.a,.b,.c,.d,.beam{animation:none}}</style></defs><rect width="1200" height="430" rx="26" fill="url(#bg)" stroke="#263244"/><rect width="1200" height="430" rx="26" fill="url(#grid)"/><circle cx="900" cy="130" r="260" fill="url(#gl)"/><g font-family="Inter,ui-sans-serif,system-ui,sans-serif"><text x="42" y="38" font-size="10" fill="#64748b" letter-spacing="3">SELECTED WORK / SYSTEM INDEX</text><text x="42" y="66" font-size="21" fill="#f8fafc">Four systems. Different problems. One engineering loop.</text><g class="a"><rect x="42" y="92" width="540" height="132" rx="18" fill="#0f172a" stroke="#263244"/><rect x="42" y="92" width="4" height="132" rx="2" fill="url(#g1)"/><text x="68" y="120" font-size="10" fill="#38bdf8" letter-spacing="2">01 / GITGLOBE</text><text x="68" y="151" font-size="19" fill="#f8fafc">Open-source discovery</text><text x="68" y="175" font-size="11" fill="#94a3b8">semantic embeddings · spherical UMAP · WebGL</text><text x="68" y="199" font-size="10" fill="#64748b">198,731 repositories · <tspan fill="#38bdf8">inspect source →</tspan></text></g><g class="b"><rect x="618" y="92" width="540" height="132" rx="18" fill="#0f172a" stroke="#263244"/><rect x="618" y="92" width="4" height="132" rx="2" fill="url(#g2)"/><text x="644" y="120" font-size="10" fill="#22c55e" letter-spacing="2">02 / NIRDHOOM</text><text x="644" y="151" font-size="19" fill="#f8fafc">Field operations</text><text x="644" y="175" font-size="11" fill="#94a3b8">booking · evidence · dispatch · OR-Tools</text><text x="644" y="199" font-size="10" fill="#64748b">field-first workflow · <tspan fill="#22c55e">inspect source →</tspan></text></g><g class="c"><rect x="42" y="246" width="540" height="132" rx="18" fill="#0f172a" stroke="#263244"/><rect x="42" y="246" width="4" height="132" rx="2" fill="#a78bfa"/><text x="68" y="274" font-size="10" fill="#a78bfa" letter-spacing="2">03 / SAATHI</text><text x="68" y="305" font-size="19" fill="#f8fafc">Voice + AI</text><text x="68" y="329" font-size="11" fill="#94a3b8">routing · consent · provider adapters · escalation</text><text x="68" y="353" font-size="10" fill="#64748b">source-backed assistance · <tspan fill="#a78bfa">inspect source →</tspan></text></g><g class="d"><rect x="618" y="246" width="540" height="132" rx="18" fill="#0f172a" stroke="#263244"/><rect x="618" y="246" width="4" height="132" rx="2" fill="#38bdf8"/><text x="644" y="274" font-size="10" fill="#38bdf8" letter-spacing="2">04 / JYC 128</text><text x="644" y="305" font-size="19" fill="#f8fafc">Production web</text><text x="644" y="329" font-size="11" fill="#94a3b8">accessibility · provenance · CI · CodeQL · QA</text><text x="644" y="353" font-size="10" fill="#64748b">public product engineering · <tspan fill="#38bdf8">inspect source →</tspan></text></g><rect class="beam" x="0" y="0" width="150" height="430" fill="#fff" opacity=".10" transform="skewX(-18)"/></g></svg>