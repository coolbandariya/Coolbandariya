<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">Bento project showcase</title><desc id="d">Animated grid of Kaustubh Dua's selected projects with spotlight accents and engineering metadata.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><linearGradient id="a"><stop stop-color="#0f766e"/><stop offset=".5" stop-color="#0284c7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><style>.c{animation:l 3.8s ease-in-out infinite}.c2{animation:l 3.8s 1s ease-in-out infinite}.c3{animation:l 3.8s 2s ease-in-out infinite}@keyframes l{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.c,.c2,.c3{animation:none}}</style></defs><rect width="1200" height="380" rx="24" fill="url(#bg)" stroke="#dbe3ec"/><g font-family="Inter,ui-sans-serif,system-ui,sans-serif"><text x="46" y="48" font-size="11" fill="#64748b" letter-spacing="2.5">SELECTED WORK / BENTO INDEX</text><g class="c"><rect x="46" y="72" width="350" height="132" rx="18" fill="#0f172a"/><text x="72" y="106" font-size="10" fill="#38bdf8" letter-spacing="2">01 · DISCOVERY</text><text x="72" y="138" font-size="23" font-weight="800" fill="#f8fafc">GitGlobe</text><text x="72" y="164" font-size="11" fill="#94a3b8">semantic search · WebGL · ML</text><text x="72" y="188" font-size="11" fill="#22c55e">198,731 repositories</text></g><g class="c2"><rect x="424" y="72" width="350" height="132" rx="18" fill="#fff" stroke="#dbe3ec"/><text x="450" y="106" font-size="10" fill="#0f766e" letter-spacing="2">02 · OPERATIONS</text><text x="450" y="138" font-size="23" font-weight="800" fill="#0f172a">Nirdhoom</text><text x="450" y="164" font-size="11" fill="#64748b">field workflows · dispatch · evidence</text><text x="450" y="188" font-size="11" fill="#0f766e">OR-Tools · PWA</text></g><g class="c3"><rect x="802" y="72" width="350" height="132" rx="18" fill="#fff" stroke="#dbe3ec"/><text x="828" y="106" font-size="10" fill="#7c3aed" letter-spacing="2">03 · ASSISTANCE</text><text x="828" y="138" font-size="23" font-weight="800" fill="#0f172a">Saathi</text><text x="828" y="164" font-size="11" fill="#64748b">voice · AI · provider-aware workflows</text><text x="828" y="188" font-size="11" fill="#7c3aed">source-backed answers</text></g><rect x="46" y="232" width="530" height="108" rx="18" fill="#fff" stroke="#dbe3ec"/><text x="72" y="265" font-size="10" fill="#64748b" letter-spacing="2">04 · PRODUCT ENGINEERING</text><text x="72" y="296" font-size="20" font-weight="800" fill="#0f172a">JYC 128</text><text x="72" y="318" font-size="11" fill="#64748b">React · Supabase · CI · CodeQL · Playwright · accessibility</text><rect x="602" y="232" width="550" height="108" rx="18" fill="#0f172a"/><text x="628" y="265" font-size="10" fill="#94a3b8" letter-spacing="2">ENGINEERING RANGE</text><text x="628" y="297" font-size="14" fill="#f8fafc">AI / ML · DATA / SYSTEMS · PRODUCT / WEB · OPTIMISATION</text><rect x="628" y="314" width="470" height="3" rx="2" fill="url(#a)"/></g></svg>