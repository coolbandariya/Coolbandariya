<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">Signal chain</title><desc id="desc">A monochrome animated guitar signal path connects idea, prototype, test and ship, with a travelling signal pulse.</desc><defs><linearGradient id="pulse"><stop stop-color="#E6EDF3" stop-opacity="0"/><stop offset=".5" stop-color="#E6EDF3"/><stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/></linearGradient></defs><style>.mono{font-family:Arial,Helvetica,sans-serif}.wire{stroke:#555;stroke-width:3;fill:none}.flow{stroke:#E6EDF3;stroke-width:3;stroke-dasharray:3 12;animation:flow 6s linear infinite}.node{fill:#111820;stroke:#777;stroke-width:2}.pulse{animation:pulse 4s ease-in-out infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}.n4{animation-delay:3s}.jack{fill:#E6EDF3}@keyframes flow{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{fill:#111820;stroke:#555}50%{fill:#30363D;stroke:#E6EDF3}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}.node{stroke:#A0A0A0}}</style><rect width="1000" height="250" rx="12" fill="#0D1117" stroke="#30363D"/><text class="mono" x="30" y="35" fill="#A0A0A0" font-size="13" letter-spacing="3">THE SIGNAL CHAIN / FROM FIRST RIFF TO RELEASE</text><path class="wire" d="M125 116H875"/><path class="flow" d="M125 116H875"/><g><circle class="node pulse n1" cx="125" cy="116" r="27"/><circle class="jack" cx="125" cy="116" r="4"/><circle class="node pulse n2" cx="375" cy="116" r="27"/><circle class="jack" cx="375" cy="116" r="4"/><circle class="node pulse n3" cx="625" cy="116" r="27"/><circle class="jack" cx="625" cy="116" r="4"/><circle class="node pulse n4" cx="875" cy="116" r="27"/><circle class="jack" cx="875" cy="116" r="4"/></g><g class="mono" text-anchor="middle"><text x="125" y="168" fill="#E6EDF3" font-size="18" font-weight="700">IDEA</text><text x="125" y="190" fill="#8B949E" font-size="13">find the riff</text><text x="375" y="168" fill="#E6EDF3" font-size="18" font-weight="700">PROTOTYPE</text><text x="375" y="190" fill="#8B949E" font-size="13">make it tangible</text><text x="625" y="168" fill="#E6EDF3" font-size="18" font-weight="700">TEST</text><text x="625" y="190" fill="#8B949E" font-size="13">check the signal</text><text x="875" y="168" fill="#E6EDF3" font-size="18" font-weight="700">SHIP</text><text x="875" y="190" fill="#8B949E" font-size="13">leave it in tune</text></g><text class="mono" x="30" y="228" fill="#666" font-size="11" letter-spacing="2">LESS NOISE · CLEARER SIGNAL · ONE MORE TAKE</text></svg>