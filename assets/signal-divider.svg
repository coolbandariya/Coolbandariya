<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="52" viewBox="0 0 1200 52" role="img" aria-labelledby="title desc">
<title id="title">Animated Minecraft-inspired redstone divider</title>
<desc id="desc">A pixel-art stone path with alternating grass and softly pulsing redstone nodes.</desc>
<style>
  .redstone{animation:pulse 1.8s ease-in-out infinite}
  .redstone2{animation:pulse 1.8s ease-in-out .9s infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.redstone,.redstone2{animation:none}}
</style>
<rect y="24" width="1200" height="4" fill="#586158"/>
<g fill="#3d7f32">
  <rect x="0" y="18" width="16" height="6"/><rect x="96" y="18" width="16" height="6"/><rect x="192" y="18" width="16" height="6"/><rect x="288" y="18" width="16" height="6"/><rect x="384" y="18" width="16" height="6"/><rect x="480" y="18" width="16" height="6"/><rect x="576" y="18" width="16" height="6"/><rect x="672" y="18" width="16" height="6"/><rect x="768" y="18" width="16" height="6"/><rect x="864" y="18" width="16" height="6"/><rect x="960" y="18" width="16" height="6"/><rect x="1056" y="18" width="16" height="6"/><rect x="1152" y="18" width="16" height="6"/>
</g>
<g class="redstone" fill="#a53b32">
  <rect x="48" y="21" width="12" height="6"/><rect x="240" y="21" width="12" height="6"/><rect x="432" y="21" width="12" height="6"/><rect x="624" y="21" width="12" height="6"/><rect x="816" y="21" width="12" height="6"/><rect x="1008" y="21" width="12" height="6"/>
</g>
<g class="redstone2" fill="#d94b3f">
  <rect x="144" y="21" width="12" height="6"/><rect x="336" y="21" width="12" height="6"/><rect x="528" y="21" width="12" height="6"/><rect x="720" y="21" width="12" height="6"/><rect x="912" y="21" width="12" height="6"/><rect x="1104" y="21" width="12" height="6"/>
</g>
</svg>