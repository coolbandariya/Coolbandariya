<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-labelledby="title desc">
<title id="title">Animated Nether-themed divider</title>
<desc id="desc">A dark basalt path with alternating glowing crimson and lava-orange nodes.</desc>
<style>
 .node{animation:pulse 1.8s ease-in-out infinite}.node2{animation:pulse 1.8s ease-in-out .9s infinite}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.node,.node2{animation:none}}
</style>
<rect x="0" y="25" width="1200" height="6" fill="#1a1114"/>
<path d="M0 25h1200" stroke="#5b2a2e" stroke-width="2"/>
<g fill="#321b20">
<rect x="0" y="18" width="72" height="14"/><rect x="144" y="18" width="72" height="14"/><rect x="288" y="18" width="72" height="14"/><rect x="432" y="18" width="72" height="14"/><rect x="576" y="18" width="72" height="14"/><rect x="720" y="18" width="72" height="14"/><rect x="864" y="18" width="72" height="14"/><rect x="1008" y="18" width="72" height="14"/><rect x="1152" y="18" width="48" height="14"/>
</g>
<g class="node" fill="#ff4b24"><rect x="88" y="21" width="18" height="8"/><rect x="376" y="21" width="18" height="8"/><rect x="664" y="21" width="18" height="8"/><rect x="952" y="21" width="18" height="8"/></g>
<g class="node2" fill="#c51f3a"><rect x="232" y="21" width="18" height="8"/><rect x="520" y="21" width="18" height="8"/><rect x="808" y="21" width="18" height="8"/><rect x="1096" y="21" width="18" height="8"/></g>
<g fill="#ff9a36" opacity=".8"><rect x="40" y="10" width="4" height="4"/><rect x="452" y="40" width="4" height="4"/><rect x="754" y="8" width="4" height="4"/><rect x="1018" y="41" width="4" height="4"/></g>
</svg>