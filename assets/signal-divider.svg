<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="34" viewBox="0 0 1000 34" role="img" aria-labelledby="title desc"><title id="title">Animated signal divider</title><desc id="desc">A moving signal pulse travels across a fine circuit line.</desc><defs><linearGradient id="pulse"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs><path d="M0 17H1000" stroke="#64748b" stroke-opacity=".28" stroke-width="1"/><path d="M0 17H1000" stroke="url(#pulse)" stroke-width="3" stroke-dasharray="120 880"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4s" repeatCount="indefinite"/></path><circle cx="500" cy="17" r="3" fill="#22d3ee"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle></svg>