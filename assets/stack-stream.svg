<clipPath id="viewport"><rect x="0" y="42" width="1200" height="72" rx="8"/></clipPath>
<style>.track{animation:stack 42s linear infinite}.shine{animation:shine 12s ease-in-out infinite}@keyframes stack{from{transform:translateX(0)}to{transform:translateX(-1362px)}}@keyframes shine{0%,100%{opacity:.35}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.track,.shine{animation:none}}</style>
