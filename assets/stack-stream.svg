<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="t d">
<title id="t">Animated engineering stack stream</title>
<desc id="d">A seamless, slow-moving stream of technologies used across Kaustubh Dua's projects. The sequence loops continuously without an empty gap.</desc>
<defs>
<linearGradient id="bg" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
