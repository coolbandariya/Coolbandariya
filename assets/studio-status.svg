<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Late-night guitar workbench</title>
<desc id="desc">A restrained monochrome desk scene with a glowing code monitor, electric guitar strings as a moving signal, a record player and four practical workbench notes. Decorative animation, not live system status.</desc>
<defs>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242424"/><stop offset="1" stop-color="#080808"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#E6EDF3" stop-opacity="0"/><stop offset=".5" stop-color="#E6EDF3" stop-opacity=".65"/><stop offset="1" stop-color="#E6EDF3" stop-opacity="0"/></linearGradient>
 <clipPath id="screen-clip"><rect x="64" y="91" width="280" height="112" rx="3"/></clipPath>
</defs>
<style>
.m{font-family:Arial,Helvetica,sans-serif}.k{font-family:'Courier New',monospace}.muted{fill:#8B949E}.bright{fill:#E6EDF3}.line{stroke:#30363D}.scan{stroke-dasharray:3 10;animation:scan 8s linear infinite}.typing{animation:typing 4.8s steps(20,end) infinite}.glow{animation:glow 4s ease-in-out infinite}.strings{stroke-dasharray:6 9;animation:strings 3.5s linear infinite}.needle{transform-origin:807px 99px;animation:needle 4s ease-in-out infinite}.disc{transform-origin:801px 285px;animation:spin 8s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}.pick{transform-origin:397px 252px;animation:pick 3s ease-in-out infinite}
@keyframes scan{to{stroke-dashoffset:-156}}@keyframes typing{0%,8%{transform:translateX(0)}55%,80%{transform:translateX(42px)}100%{transform:translateX(0)}}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}@keyframes strings{to{stroke-dashoffset:-60}}@keyframes needle{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(20deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes pick{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.scan,.typing,.glow,.strings,.needle,.disc,.cursor,.pick{animation:none!important}.needle{transform:rotate(0)}.glow{opacity:1}}
</style>
<rect x="1" y="1" width="998" height="418" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<path d="M25 54H975" class="line" stroke-width="1"/><text class="k muted" x="28" y="34" font-size="12" letter-spacing="2">FIELD RECORDING / 001</text><text class="k muted" x="972" y="34" font-size="12" text-anchor="end" letter-spacing="2">MONOCHROME STUDIO</text>
<text class="m bright" x="28" y="83" font-size="25" font-weight="700">The workbench</text><text class="m muted" x="972" y="82" font-size="14" text-anchor="end">Make something useful. Then make it solid.</text>
<!-- left: desk / monitor -->
<rect x="25" y="105" width="460" height="281" rx="10" fill="#111820" stroke="#30363D"/>
<rect x="48" y="126" width="312" height="134" rx="7" fill="#202830" stroke="#666"/>
<rect x="63" y="140" width="282" height="105" rx="4" fill="url(#screen)" stroke="#444"/>
<g clip-path="url(#screen-clip)" class="glow"><path d="M64 112V220" stroke="#E6EDF3" stroke-opacity=".07" stroke-width="32"/><path d="M82 157H177M82 171H222M82 185H148M82 199H198M82 213H165" stroke="#A0A0A0" stroke-width="3" stroke-linecap="round" opacity=".72"/><path d="M82 226H250" stroke="#E6EDF3" stroke-width="2" opacity=".35"/><rect class="cursor" x="257" y="219" width="7" height="12" fill="#E6EDF3"/></g>
<path d="M180 260V278M142 280H218" stroke="#555" stroke-width="5" stroke-linecap="round"/><rect x="75" y="291" width="280" height="8" rx="3" fill="#30363D"/><path d="M92 307H336" stroke="#555" stroke-width="2"/>
<!-- six strings become signal -->
<path d="M62 326H441" stroke="#555" stroke-width="7" stroke-linecap="round"/>
<g class="strings" fill="none" stroke="#D8D8D8" stroke-width="1.2"><path d="M62 315H441M62 321H441M62 327H441M62 333H441M62 339H441M62 345H441"/></g>
<g class="pick"><path d="M396 308l13 10-8 17-13-10z" fill="#E6EDF3" stroke="#A0A0A0"/></g>
<text class="k muted" x="48" y="369" font-size="11" letter-spacing="1.5">IDEA → PROTOTYPE → TEST → SHIP</text>
<!-- right: notes and instruments -->
<rect x="505" y="105" width="470" height="281" rx="10" fill="#111820" stroke="#30363D"/>
<text class="k muted" x="530" y="132" font-size="11" letter-spacing="2">NOTES FROM THE SESSION</text>
<g class="m">
<circle cx="537" cy="164" r="3.5" fill="#E6EDF3"/><text x="552" y="160" class="bright" font-size="15" font-weight="700">01 / Write the riff</text><text x="552" y="179" class="muted" font-size="13">Start with one useful, shippable slice.</text><path d="M530 191H950" class="line"/>
<circle cx="537" cy="215" r="3.5" fill="#BDBDBD"/><text x="552" y="211" class="bright" font-size="15" font-weight="700">02 / Listen closely</text><text x="552" y="230" class="muted" font-size="13">Reproduce the issue; test the assumption.</text><path d="M530 242H950" class="line"/>
<circle cx="537" cy="266" r="3.5" fill="#8B949E"/><text x="552" y="262" class="bright" font-size="15" font-weight="700">03 / Find the groove</text><text x="552" y="281" class="muted" font-size="13">Make the next action feel obvious.</text><path d="M530 293H950" class="line"/>
<circle cx="537" cy="317" r="3.5" fill="#666"/><text x="552" y="313" class="bright" font-size="15" font-weight="700">04 / Tune the signal</text><text x="552" y="332" class="muted" font-size="13">Test edge cases. Verify before shipping.</text>
</g>
<!-- small VU arc and vinyl -->
<path d="M532 362H950" class="line"/><text class="k muted" x="530" y="378" font-size="10" letter-spacing="1.2">RESET TRACK</text>
<g class="disc"><circle cx="906" cy="362" r="15" fill="#090909" stroke="#777"/><circle cx="906" cy="362" r="10" fill="none" stroke="#30363D"/><path d="M906 350V374M894 362H918" stroke="#777" stroke-width="1"/><circle cx="906" cy="362" r="2.5" fill="#E6EDF3"/></g>
<text class="m bright" x="620" y="369" font-size="13">Pause. Listen. Reset.</text>
<path class="scan" d="M25 397H975" stroke="#A0A0A0" stroke-width="1" fill="none"/>
</svg>