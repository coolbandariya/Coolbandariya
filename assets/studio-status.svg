<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Studio status</title>
<desc id="desc">Animated monochrome personal developer status panel with room notes, system status bars and the current featured track Iris by Goo Goo Dolls.</desc>
<style>.status-scan{stroke:#E5E5E5;stroke-opacity:.22;stroke-width:1;stroke-dasharray:3 12;animation:scan 9s linear infinite}.status-pulse{animation:statusPulse 2.6s ease-in-out infinite}.cursor-blink{animation:blink 1.2s steps(2,end) infinite}@keyframes scan{to{stroke-dashoffset:-180}}@keyframes statusPulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.status-scan,.status-pulse,.cursor-blink{animation:none!important}.status-pulse{opacity:1}}</style>
<rect x="1" y="1" width="998" height="428" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<path d="M500 1V429" stroke="#30363D" stroke-width="2"/><path class="status-scan" d="M18 132H982M18 395H982" fill="none"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="38" y="45" fill="#A0A0A0" font-size="15" letter-spacing="3" font-weight="700">THE ROOM</text>
  <text x="38" y="82" fill="#E6EDF3" font-size="28" font-weight="600">Build. Learn. Repeat.</text>
  <text x="38" y="112" fill="#8B949E" font-size="16">Late-night sessions, careful fixes, better tools.</text>
  <rect x="38" y="145" width="424" height="240" rx="12" fill="#111820" stroke="#30363D"/>
  <rect x="64" y="174" width="132" height="84" rx="7" fill="#202830" stroke="#777777"/>
  <rect x="75" y="185" width="110" height="59" rx="3" fill="#0D1117" stroke="#555555"/>
  <path d="M87 200H163M87 211H145M87 222H154" stroke="#A0A0A0" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 259V271M96 272H128" stroke="#777777" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 230h180" stroke="#777777" stroke-width="6" stroke-linecap="round"/>
  <path d="M247 230v-23q0-10 10-10h45q10 0 10 10v23M256 197v-9h47v9" fill="#30363D" stroke="#A0A0A0" stroke-width="2"/>
  <circle cx="268" cy="218" r="4" fill="#E5E5E5"/><circle cx="286" cy="218" r="4" fill="#777777"/><circle cx="304" cy="218" r="4" fill="#BDBDBD"/>
  <text x="64" y="310" fill="#E6EDF3" font-size="19" font-weight="600">Current mode</text>
  <text x="64" y="338" fill="#A0A0A0" font-size="16">Engineering · debugging · shipping</text>
  <text x="64" y="365" fill="#777777" font-size="13" letter-spacing="1">FOCUS ON THE DETAILS</text>
  <text x="538" y="45" fill="#A0A0A0" font-size="15" letter-spacing="3" font-weight="700">SYSTEM STATUS</text>
  <text x="538" y="86" fill="#C9C9C9" font-size="16">Building</text><rect x="672" y="70" width="270" height="13" rx="6.5" fill="#252525"/><rect x="672" y="70" width="208" height="13" rx="6.5" fill="#E5E5E5"/>
  <text x="538" y="130" fill="#C9C9C9" font-size="16">Learning</text><rect x="672" y="114" width="270" height="13" rx="6.5" fill="#252525"/><rect x="672" y="114" width="178" height="13" rx="6.5" fill="#BDBDBD"/>
  <text x="538" y="174" fill="#C9C9C9" font-size="16">Designing</text><rect x="672" y="158" width="270" height="13" rx="6.5" fill="#252525"/><rect x="672" y="158" width="150" height="13" rx="6.5" fill="#969696"/>
  <text x="538" y="218" fill="#C9C9C9" font-size="16">Resting</text><rect x="672" y="202" width="270" height="13" rx="6.5" fill="#252525"/><rect x="672" y="202" width="68" height="13" rx="6.5" fill="#555555"/>
  <path d="M538 246H942" stroke="#30363D" stroke-width="2"/>
  <text x="538" y="280" fill="#A0A0A0" font-size="15" letter-spacing="3" font-weight="700">NOW PLAYING</text>
  <circle class="vinyl-spin" cx="577" cy="337" r="31" fill="#161B22" stroke="#777777" stroke-width="2"/>
  <circle cx="577" cy="337" r="5" fill="#E5E5E5"/>
  <circle cx="577" cy="337" r="20" fill="none" stroke="#30363D"/>
  <path d="M577 337L594 321M577 337L560 328M577 337L570 355" stroke="#C9C9C9" stroke-width="3" stroke-linecap="round"/>
  <text x="625" y="329" fill="#E6EDF3" font-size="22" font-weight="600">Iris</text>
  <text x="625" y="356" fill="#A0A0A0" font-size="16">Goo Goo Dolls</text>
  <text x="625" y="381" fill="#777777" font-size="12" letter-spacing="1">THE RIFF · THE FEEL · THE RESET</text>
</g>
