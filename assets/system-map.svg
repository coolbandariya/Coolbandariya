<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-labelledby="title desc">
<title id="title">Product engineering system map</title>
<desc id="desc">Three connected stages: product, intelligence, and reliability. Animated particles travel along the connections.</desc>
<defs>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#777"/><stop offset=".5" stop-color="#c8c8c8"/><stop offset="1" stop-color="#777"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .panel{fill:#101010;stroke:#3a3a3a;stroke-width:1.5}.node{fill:#171717;stroke:#777;stroke-width:1.5}.label{fill:#f0eee8;font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}.sub{fill:#9d9d9d;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.link{stroke:url(#line);stroke-width:1.5;fill:none;stroke-dasharray:5 8;animation:flow 8s linear infinite}.dot{fill:#f0eee8;filter:url(#glow);animation:travel 8s linear infinite}.pulse{fill:none;stroke:#aaa;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-out infinite}.beam{stroke:url(#beam);stroke-width:3;stroke-linecap:round;stroke-dasharray:18 620;animation:beam 6s linear infinite}.node{transition:stroke .3s ease,fill .3s ease}@keyframes flow{to{stroke-dashoffset:-104}}@keyframes beam{from{stroke-dashoffset:638}to{stroke-dashoffset:0}}@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(660px);opacity:0}}@keyframes pulse{0%{transform:scale(.8);opacity:.65}80%,100%{transform:scale(1.45);opacity:0}}
  @media(prefers-reduced-motion:reduce){.link,.dot,.pulse,.beam{animation:none}.dot{opacity:.8;transform:translateX(330px)}}
</style>
<rect class="panel" x="1" y="1" width="1198" height="162" rx="12"/>
<text class="sub" x="28" y="27">A PRACTICAL BUILD PIPELINE</text>
<path class="link" d="M270 91H465 M600 91H795"/><path class="beam" d="M270 91H930"/>
<circle class="dot" cx="270" cy="91" r="3.5"/>
<g transform="translate(100 48)"><rect class="node" width="170" height="86" rx="9"/><circle class="pulse" cx="85" cy="43" r="18"/><text class="label" x="85" y="39" text-anchor="middle">PRODUCT</text><text class="sub" x="85" y="59" text-anchor="middle">USEFUL BY DESIGN</text></g>
<g transform="translate(515 48)"><rect class="node" width="170" height="86" rx="9"/><circle class="pulse" cx="85" cy="43" r="18" style="animation-delay:1.2s"/><text class="label" x="85" y="39" text-anchor="middle">INTELLIGENCE</text><text class="sub" x="85" y="59" text-anchor="middle">DATA · AI · SYSTEMS</text></g>
<g transform="translate(930 48)"><rect class="node" width="170" height="86" rx="9"/><circle class="pulse" cx="85" cy="43" r="18" style="animation-delay:2.4s"/><text class="label" x="85" y="39" text-anchor="middle">RELIABILITY</text><text class="sub" x="85" y="59" text-anchor="middle">TEST · VERIFY · SHIP</text></g>
</svg>