<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-labelledby="title desc">
<title id="title">Animated engineering system map</title>
<desc id="desc">Three connected nodes represent product interfaces, intelligent systems and reliable delivery. Small particles travel along the connections while the nodes softly pulse.</desc>
<defs>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4efe5" stop-opacity=".12"/><stop offset=".5" stop-color="#f4efe5" stop-opacity=".8"/><stop offset="1" stop-color="#f4efe5" stop-opacity=".12"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .node{transform-box:fill-box;transform-origin:center;animation:breathe 4.8s ease-in-out infinite}
    .n2{animation-delay:1.6s}.n3{animation-delay:3.2s}
    .particle{animation:travel 6s linear infinite}
    .p2{animation-delay:2s}.p3{animation-delay:4s}
    .spark{animation:blink 2.8s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.06);opacity:1}}
    @keyframes travel{0%{transform:translateX(0);opacity:0}10%,80%{opacity:1}100%{transform:translateX(880px);opacity:0}}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.node,.particle,.spark{animation:none!important}.node{opacity:1}.particle{display:none}.spark{opacity:1}}
  </style>
</defs>
<rect width="1200" height="164" rx="8" fill="#100e10"/>
<path d="M24 22H1176M24 142H1176" stroke="#e9e2d7" stroke-opacity=".14"/>
<text x="30" y="43" class="mono" font-size="10" letter-spacing="2" fill="#77716b">SYSTEM MAP / 03 CONNECTED LAYERS</text>
<path d="M160 88H1040" stroke="#e9e2d7" stroke-opacity=".22" stroke-width="1.5"/>
<path d="M160 88H1040" stroke="url(#wire)" stroke-width="1.5" stroke-dasharray="5 9"/>
<g class="particle" transform="translate(160 0)"><circle cx="0" cy="88" r="3" fill="#f4efe5"/></g>
<g class="particle p2" transform="translate(160 0)"><circle cx="0" cy="88" r="2" fill="#b9b1a5"/></g>
<g class="particle p3" transform="translate(160 0)"><circle cx="0" cy="88" r="1.5" fill="#f4efe5"/></g>
<g class="node n1">
  <circle cx="160" cy="88" r="25" fill="#100e10" stroke="#f4efe5" stroke-opacity=".75"/>
  <circle cx="160" cy="88" r="16" fill="none" stroke="#f4efe5" stroke-opacity=".3"/>
  <path d="M151 81H169V95H151ZM155 77H165" fill="none" stroke="#f4efe5" stroke-width="1.3"/>
</g>
<g class="node n2">
  <circle cx="600" cy="88" r="25" fill="#100e10" stroke="#f4efe5" stroke-opacity=".75"/>
  <circle cx="600" cy="88" r="16" fill="none" stroke="#f4efe5" stroke-opacity=".3"/>
  <path d="M600 76L611 88L600 100L589 88Z" fill="none" stroke="#f4efe5" stroke-width="1.3"/>
  <circle cx="600" cy="88" r="3" fill="#f4efe5"/>
</g>
<g class="node n3">
  <circle cx="1040" cy="88" r="25" fill="#100e10" stroke="#f4efe5" stroke-opacity=".75"/>
  <circle cx="1040" cy="88" r="16" fill="none" stroke="#f4efe5" stroke-opacity=".3"/>
  <path d="M1031 88L1037 94L1049 81" fill="none" stroke="#f4efe5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g class="mono" fill="#f4efe5" text-anchor="middle">
  <text x="160" y="128" font-size="11" letter-spacing="1.4">PRODUCT</text>
  <text x="600" y="128" font-size="11" letter-spacing="1.4">INTELLIGENCE</text>
  <text x="1040" y="128" font-size="11" letter-spacing="1.4">RELIABILITY</text>
</g>
<circle class="spark" cx="190" cy="63" r="2" fill="#f4efe5"/>
<circle class="spark" cx="628" cy="61" r="1.5" fill="#f4efe5"/>
<circle class="spark" cx="1067" cy="65" r="2" fill="#f4efe5"/>
<text x="1170" y="155" class="mono" font-size="9" letter-spacing="1.2" fill="#77716b" text-anchor="end">DESIGN → REASON → VERIFY</text>
</svg>
