<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d"><title id="t">Digital workshop command panel</title><desc id="d">Animated terminal and bento dashboard showing the engineering workflow and selected systems.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="a"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.type{animation:t 5s steps(36,end) infinite}.cursor{animation:b 1s steps(1,end) infinite}.scan{animation:s 5s ease-in-out infinite}@keyframes t{0%,10%{clip-path:inset(0 100% 0 0)}45%,75%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}@keyframes b{50%{opacity:0}}@keyframes s{0%,100%{transform:translateX(-50px);opacity:0}30%,70%{opacity:.7}50%{transform:translateX(1320px)}}@media(prefers-reduced-motion:reduce){.type,.cursor,.scan{animation:none}}</style></defs><rect width="1400" height="360" rx="24" fill="url(#bg)" stroke="#334155"/><rect x="28" y="28" width="1344" height="304" rx="18" fill="none" stroke="#1e293b"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><rect x="62" y="62" width="720" height="236" rx="16" fill="#020617" stroke="#263244"/><circle cx="90" cy="88" r="5" fill="#ef4444"/><circle cx="108" cy="88" r="5" fill="#eab308"/><circle cx="126" cy="88" r="5" fill="#22c55e"/><text x="160" y="93" font-size="10" fill="#64748b">KAUSTUBH@WORKSHOP</text><text x="90" y="140" font-size="13" fill="#22c55e">$</text><text x="110" y="140" font-size="13" fill="#e2e8f0">build --system useful-software</text><text x="90" y="171" font-size="12" fill="#94a3b8">[01] understand constraints</text><text x="90" y="195" font-size="12" fill="#94a3b8">[02] design the smallest useful system</text><text x="90" y="219" font-size="12" fill="#94a3b8">[03] test failure paths</text><text x="90" y="243" font-size="12" fill="#22c55e">[04] verify evidence → ship</text><text x="90" y="274" font-size="13" fill="#38bdf8">$</text><g class="type"><text x="110" y="274" font-size="13" fill="#e2e8f0">status: learning by shipping</text></g><rect class="cursor" x="326" y="262" width="8" height="16" fill="#38bdf8"/></g><g font-family="Inter,ui-sans-serif,system-ui,sans-serif"><rect x="824" y="62" width="482" height="70" rx="16" fill="#0f172a" stroke="#263244"/><text x="850" y="89" font-size="10" fill="#64748b" letter-spacing="2">NOW BUILDING</text><text x="850" y="113" font-size="16" font-weight="700" fill="#f8fafc">AI + data + real-world workflows</text><rect x="824" y="148" width="228" height="150" rx="16" fill="#0f172a" stroke="#263244"/><text x="850" y="178" font-size="10" fill="#22c55e">PROOF</text><text x="850" y="210" font-size="28" font-weight="800" fill="#f8fafc">7+</text><text x="850" y="232" font-size="11" fill="#94a3b8">selected systems</text><rect x="850" y="252" width="170" height="3" rx="2" fill="url(#a)"/><rect x="1074" y="148" width="232" height="150" rx="16" fill="#0f172a" stroke="#263244"/><text x="1100" y="178" font-size="10" fill="#38bdf8">VALUES</text><text x="1100" y="210" font-size="12" fill="#cbd5e1">clarity</text><text x="1100" y="232" font-size="12" fill="#cbd5e1">evidence</text><text x="1100" y="254" font-size="12" fill="#cbd5e1">usefulness</text><text x="1100" y="276" font-size="12" fill="#cbd5e1">shipping</text></g><g class="scan"><rect x="0" y="42" width="3" height="276" fill="#38bdf8"/></g></svg>