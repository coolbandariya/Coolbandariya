<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc"><title id="title">Studio VU meter</title><desc id="desc">Decorative monochrome VU meter with animated needles and level bars. It does not represent live build, audio or uptime telemetry.</desc><style>.mono{font-family:Arial,Helvetica,sans-serif}.needle{transform-origin:500px 122px;animation:needle 3.8s ease-in-out infinite}.needle2{animation-delay:-1.2s}.bar{animation:level 1.6s ease-in-out infinite alternate}.bar:nth-of-type(2n){animation-delay:-.7s}.bar:nth-of-type(3n){animation-delay:-1.1s}@keyframes needle{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(24deg)}}@keyframes level{from{opacity:.3;transform:scaleY(.45)}to{opacity:1;transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){.needle,.bar{animation:none!important}.needle{transform:rotate(0deg)}.bar{opacity:.75;transform:scaleY(.7)}}</style><rect width="1000" height="180" rx="12" fill="#0D1117" stroke="#30363D"/><text class="mono" x="28" y="30" fill="#A0A0A0" font-size="12" letter-spacing="3">VU / VISUAL RHYTHM ONLY</text><g transform="translate(90 52)"><rect width="350" height="94" rx="7" fill="#111820" stroke="#555"/><path d="M26 72A150 150 0 0 1 324 72" fill="none" stroke="#777" stroke-width="2"/><g stroke="#8B949E" stroke-width="2"><path d="M42 62l-8 -8M67 43l-7 -10M100 28l-3 -12M135 20v-12M175 17l3 -12M210 23l6 -11M245 39l8 -10M278 57l10 -7"/></g><path d="M40 73H310" stroke="#30363D" stroke-width="2"/><path class="needle" d="M175 72L82 32" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/><circle cx="175" cy="72" r="6" fill="#E6EDF3"/></g><g transform="translate(500 54)"><text class="mono" x="0" y="10" fill="#E6EDF3" font-size="18" font-weight="700">SIGNAL CLEAN</text><text class="mono" x="0" y="32" fill="#8B949E" font-size="12">NO LIVE TELEMETRY</text><g transform="translate(0 48)" fill="#C9C9C9"><rect class="bar" x="0" y="0" width="16" height="32" rx="2"/><rect class="bar" x="24" y="8" width="16" height="24" rx="2"/><rect class="bar" x="48" y="2" width="16" height="30" rx="2"/><rect class="bar" x="72" y="13" width="16" height="19" rx="2"/><rect class="bar" x="96" y="5" width="16" height="27" rx="2"/><rect class="bar" x="120" y="0" width="16" height="32" rx="2"/><rect class="bar" x="144" y="10" width="16" height="22" rx="2"/><rect class="bar" x="168" y="4" width="16" height="28" rx="2"/><rect class="bar" x="192" y="12" width="16" height="20" rx="2"/><rect class="bar" x="216" y="3" width="16" height="29" rx="2"/><rect class="bar" x="240" y="8" width="16" height="24" rx="2"/><rect class="bar" x="264" y="1" width="16" height="31" rx="2"/><rect class="bar" x="288" y="13" width="16" height="19" rx="2"/><rect class="bar" x="312" y="4" width="16" height="28" rx="2"/><rect class="bar" x="336" y="10" width="16" height="22" rx="2"/><rect class="bar" x="360" y="2" width="16" height="30" rx="2"/></g></g><text class="mono" x="970" y="162" text-anchor="end" fill="#666" font-size="10" letter-spacing="2">DECORATIVE STUDIO MOTION</text></svg>