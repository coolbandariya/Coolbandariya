<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" role="img" aria-labelledby="t d"><title id="t">Interactive engineering command center</title><desc id="d">Animated command center with kinetic terminal text, scanning beam, status pulses, floating proof cards and a build pipeline.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="g"><stop stop-color="#22c55e"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".24"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern><filter id="blur"><feGaussianBlur stdDeviation="18"/></filter><style>
.k{animation:k 6s ease-in-out infinite}.p{animation:p 2.2s ease-in-out infinite}.p2{animation:p 2.2s .55s ease-in-out infinite}.p3{animation:p 2.2s 1.1s ease-in-out infinite}.scan{animation:scan 5s ease-in-out infinite}.type{animation:type 7s steps(42,end) infinite}.cursor{animation:blink 1s steps(1,end) infinite}.bar{animation:bar 3.2s ease-in-out infinite}.float{animation:float 4.5s ease-in-out infinite}.float2{animation:float 4.5s 1.4s ease-in-out infinite}@keyframes k{50%{transform:translateY(-5px)}}@keyframes p{50%{opacity:.45;transform:scale(1.18)}}@keyframes scan{0%,100%{transform:translateX(-100px);opacity:0}25%,75%{opacity:.65}50%{transform:translateX(1350px)}}@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}48%,78%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}@keyframes blink{50%{opacity:0}}@keyframes bar{0%,100%{transform:scaleX(.35);transform-origin:left}50%{transform:scaleX(1)}}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.k,.p,.p2,.p3,.scan,.type,.cursor,.bar,.float,.float2{animation:none}}</style></defs><rect width="1400" height="390" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="388" rx="25" fill="url(#grid)" stroke="#263244"/><circle cx="1120" cy="80" r="210" fill="url(#glow)" filter="url(#blur)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><text x="38" y="34" font-size="10" fill="#64748b" letter-spacing="3">DIGITAL WORKSHOP / LIVE BUILD</text><g class="k"><rect x="38" y="55" width="790" height="205" rx="18" fill="#050a14" stroke="#263244"/><circle class="p" cx="64" cy="78" r="5" fill="#22c55e"/><circle class="p2" cx="82" cy="78" r="5" fill="#38bdf8"/><circle class="p3" cx="100" cy="78" r="5" fill="#a78bfa"/><text x="62" y="115" font-size="12" fill="#64748b">$ build --profile kaustubhdua</text><text class="type" x="62" y="150" font-size="22" fill="#e2e8f0">understand constraints → design → build</text><text x="62" y="181" font-size="15" fill="#94a3b8">test failure paths → verify evidence → ship<tspan class="cursor" fill="#38bdf8">_</tspan></text><rect x="62" y="215" width="560" height="4" rx="2" fill="#1e293b"/><rect class="bar" x="62" y="215" width="560" height="4" rx="2" fill="url(#g)"/></g><g class="float"><rect x="858" y="55" width="500" height="92" rx="18" fill="#0f172a" stroke="#263244"/><text x="884" y="82" font-size="10" fill="#22c55e" letter-spacing="2">NOW SHIPPING</text><text x="884" y="112" font-size="18" fill="#f8fafc">AI · DATA · SYSTEMS · PRODUCT</text><text x="884" y="134" font-size="11" fill="#64748b">real projects · explicit constraints · inspectable proof</text></g><g class="float2"><rect x="858" y="164" width="240" height="96" rx="18" fill="#0f172a" stroke="#263244"/><text x="882" y="192" font-size="10" fill="#38bdf8">PROOF</text><text x="882" y="219" font-size="13" fill="#cbd5e1">GitGlobe</text><text x="882" y="241" font-size="11" fill="#64748b">198,731 repos</text><circle class="p" cx="1068" cy="219" r="6" fill="#38bdf8"/></g><g class="float"><rect x="1116" y="164" width="242" height="96" rx="18" fill="#0f172a" stroke="#263244"/><text x="1140" y="192" font-size="10" fill="#a78bfa">SIGNAL</text><text x="1140" y="219" font-size="13" fill="#cbd5e1">BUILD LOOP</text><text x="1140" y="241" font-size="11" fill="#64748b">test · verify · ship</text><circle class="p2" cx="1328" cy="219" r="6" fill="#a78bfa"/></g><g transform="translate(38 300)"><text x="0" y="0" font-size="10" fill="#64748b" letter-spacing="2">PIPELINE</text><g font-size="11"><text x="115" y="0" fill="#cbd5e1">01 UNDERSTAND</text><text x="300" y="0" fill="#cbd5e1">02 DESIGN</text><text x="452" y="0" fill="#cbd5e1">03 BUILD</text><text x="595" y="0" fill="#cbd5e1">04 TEST</text><text x="725" y="0" fill="#cbd5e1">05 VERIFY</text><text x="870" y="0" fill="#cbd5e1">06 SHIP</text></g><path d="M0 18H1120" stroke="#1e293b" stroke-width="2"/><path class="scan" d="M0 18H90" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/></g></g></svg>